directions:
- name: 强关联电子系统
  code: cond-mat.str-el
  scope: 研究强相互作用电子与量子多体系统中的关联效应、量子相、纠缠结构及其理论和数值描述问题。
  seeds:
  - DMRG
  - 密度矩阵重整化群
  - density matrix renormalization group
  - matrix product state
  - Hubbard模型
  - Hubbard model
  - t-J模型

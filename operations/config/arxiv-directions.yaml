  - Mott insulator
  - 自旋液体
  - spin liquid
  - 量子多体
  - quantum many-body
  - entanglement entropy
  - topological order
  - kagome晶格
- name: 统计力学
  code: cond-mat.stat-mech
  scope: 研究多体系统的统计规律、相变与临界现象、非平衡过程及其热力学和随机动力学描述问题。
  seeds:
  - 相变
  - phase transition
  - 临界现象
  - critical phenomena

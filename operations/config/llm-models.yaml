notes:
  - 该清单用于模型选择与配置审计，不作为运行时白名单；provider 模型上下线不应阻断摄入。
  - 命题抽取推荐 MiniMax-M3：短 JSON、fast reasoning、450 token 上限；失败后回退主模型。
  - 视觉产物 QA 推荐 GLM-4.6V：覆盖图像与页面布局理解并输出结构化 JSON；调用失败时回退同系列 GLM-4.5V。
  - GLM-5.3-Flash 当前 endpoint 于 2026-09-01 实测 reasoning_effort 接受 low/high、拒绝 medium；摄入映射 fast/standard=low、deep/xdeep=high。

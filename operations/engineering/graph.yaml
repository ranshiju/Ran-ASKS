capabilities:
  ingest:
    entry: route
    required:
    - agents
    - ingest
    - schemas
    - graph_ingest
    - ingest_check
    optional:
    - llm_structured
    - recovery_policy
    - api_ingest
    - experiences
    - experience_recall
    - direction_matcher
    - cluster_keywords
    - ingest_build
    - ingest_plan
    - long_document_plan
    - derivation_state
    forbidden:
    - triples_legacy
    guardrails:
    - 按 stage 执行：先编码落盘，再巩固建图，最后校验/日志；不得跳 stage。
    - 关系和 keyword 先有 raw/wiki 证据；graph.db 是当前边主数据，禁用 Markdown triples 主路径。
    - 每个改动页必须 ingest_check；ERROR 清零，WARN 向用户提示。
    - INGEST_BACKEND=api 时 ingest_paper.py 内部通过 call_text() 调用 API LLM 撰写 wiki 与语义槽；api_ingest.py 仅用于证据卡受限场景，非 inbox 论文主入口。hybrid 模式已删除，INGEST_BACKEND 只接受 agent|api。
  query:
    entry: route
    required:
    - agents
    - query
    - query_graph
    - query_orchestrate
    optional:
    - query_actions
    - node_semantics
    - graph_dump
    - experiences
    - experience_recall
    forbidden: []
    guardrails:
    - 图、Hub、Navigation 只定位；事实性结论从相关 Wiki section 的脚注下钻 Raw；edge locator 有则可用、没有也合法。
    - 先读 Navigation，再按需读 Content/raw；同一 action key 不重复执行。
    - 续查必须有具体缺口和候选；无候选时限定性回答，不无限回环。
    - route 的 query 先派发 start；候选定位后才取 evidence，有具体缺口才取 continue，交付前取 answer。
    - start 阶段无固定检索策略时应先记录轻量检索策略；API 首轮 discover/read 必须提交 drafted 或 skipped 策略。
  hub:
    entry: route
    required:
    - agents
    - hub
    - graph_ingest
    - hub_semantics
    optional:
    - graph_metrics
    forbidden: []
    guardrails:
    - Hub 是 keyword、proposition、People page 等普通节点形成的可重叠动态群落；arXiv 方向只提供初始化 Scope，不是成员或身份定义。
    - People page 以可定位人物画像参与；研究者写研究对象/问题/方法，行政人员写职责/服务范围，学生写学习或研究阶段/关注方向，其他角色写与导航相关的实际活动范围。
    - 代码负责类型感知 profile、semantic+structural affinity、membership、原型、new/split/merge candidate 与 query probe；未归类或歧义是正常状态。
    - 普通 membership 是可重建导航状态，可由程序自动更新；inbox 收尾把达标新 Hub 与稳定超限分裂候选交给主 Agent，只有主 Agent 可确认 title、Scope、parent 及 create/split/merge canonical 语义。
    - 节点数量变化只触发动力学检查；分裂与合并须有分布变化、迟滞和 query utility 证据，单一 embedding 分数不得触发生命周期写入。
  build:
    entry: route
    required:
    - agents
    - conventions
    - route
    - guidance
    - engineering_locator
    optional:
    - handbook
    - experiences
    - experience_recall
    - graph_lib
    - graph_ingest
    - query_graph
    - ingest_check
    - prompt_test
    - graph_validate
    - graph_repair
    forbidden:
    - triples_legacy
    guardrails:
    - 先运行 impact 查最小影响面；impact 先输出可确定的 graph.yaml node/contract/capability 与 code-guidance 精确 locator，再为实现/测试输出按需 filtered-list 入口，不枚举大型 YAML 全表。
    - 建设 Agent 先直接 read impact 推荐精确 locator；不足时用 list --prefix 缩小发现范围，再用返回的 Markdown/YAML/Python/行范围 locator 精确 read。rg 只用于定位候选文件或符号。仅 locator 明确不支持、报错或所需上下文本身跨多个块时才定向扩大读取，并说明原因。
    - 变更后运行相应回归/校验；工程文档（code-guidance/graph.yaml/HUB.md/INGEST.md 等）受影响时由 agent 自主判断并同步更新，保持文档与代码一致。
  lint:
    entry: route
    required:
    - agents
    - lint
    - graph_metrics
    - ingest_check
    optional:
    - graph_dump
    - graph_validate
    forbidden: []
    guardrails:
    - Lint 负责发现和报告，不因发现问题自动扩面修复。
  sync:
    entry: route
    required:
    - agents
    - sync
    - graph_metrics
    optional:
    - graph_dump
    forbidden: []
    guardrails:
    - 按增量、补漏、一致性三层对账；不一致必须报告，不静默猜测。
  write:
    entry: route
    required:
    - agents
    - write
    optional:
    - physics_manuscript_editing
    - experiences
    - experience_recall
    forbidden: []
    guardrails:
    - 对外主张先取可追溯证据；不把未核验知识库内容写成事实。
    - write 是按需落笔能力；academic profile 在 research 状态内组合共享约定与学科 overlay，不切换研究上下文。
  research:
    entry: route
    required:
    - agents
    - research
    optional:
    - write
    - physics_manuscript_editing
    - research_memory
    - research_project
    - frontier_spec
    - frontier
    forbidden: []
    guardrails:
    - 研究内容不入库（独立于 ingest）；记忆绑定到 projects/<name>/.research-memory/。
    - 进入研究项目先 recall 恢复上下文；研究过程自动保存记忆（decision/insight/literature_judgment/research_direction）。
    - research 是持续工作状态；只有实际起草、改写或润色时调用 academic write 能力，查询、实验与状态汇报不加载写作能力。
    - 产出限于研究笔记和论文文稿；不自动摄入知识库。
  frontier:
    entry: route
    required:
    - agents
    - frontier_spec
    - frontier
    optional:
    - wg
    - query_actions
    - llm_structured
    forbidden: []
    guardrails:
    - Frontier 是独立研究前沿 overlay；只单向引用 Raw/Wiki/Graph，不修改事实层。
    - 每个捕获问题写入或精确复用单一 Question Page；库内回答只用紧凑 Graph→Wiki→Raw 证据包，支持结论必须引用包内 Raw locator。
    - Question fact_links 只固化问题来源与 supported_claim 实际引用，不固化一次召回的低相关候选。
    - 用户问题先查库、查重和评估 kb_state；模型不可用或回答失败时保留 captured/pending，active 必须人审，scientific_state 不自动更新。
    - Graph 稀疏导航；相似关系与 AI 推导默认 candidate，不自动建正式边。
  scan:
    entry: route
    required:
    - agents
    - scan
    optional: []
    forbidden: []
    guardrails:
    - 扫描只分类和报告候选；未获执行授权不移动或摄入文件。
  inbox:
    entry: route
    required:
    - agents
    - inbox
    - inbox_finalize
    - inbox_ingest
    - ingest_paper
    - ingest_document
    optional: []
    forbidden: []
    guardrails:
    - 全文只读一次：先入临时区提取文本，单遍完成归类/命名/wiki 编译；不为分类和 wiki 分别读全文。
    - sources 前置决策：撰写时直接填最终 raw 路径，落位即正确；不留占位、不后置替换；临时区路径不得入正式 sources。
    - 落位只接受 manifest 声明的实体文件；目标冲突失败，提交和 cleanup 仅作用于当前临时项。
    - 全论文批量只允许 prepare 有界并发；graph commit 保持串行且继续受 graph_ready 屏障约束。
    - 非阻断语义降级必须进入逐文件状态与持久化报告，不得仅以 completed 掩盖。
    verify:
    - python3 .scripts/test_inbox_finalize.py
    - python3 .scripts/test_prompt_audit.py
    - python3 .scripts/engineering_graph.py validate
contracts:
- id: route-capability-coverage
  nodes:
  - route

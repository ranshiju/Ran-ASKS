    - python3 .scripts/test_frontier.py
    - python3 .scripts/test_wg.py
    - python3 .scripts/engineering_graph.py validate
  research_memory:
    preconditions:
    - 只作为既有 research_memory.py CLI/Python API 与 .research-memory 布局的兼容门面；新通用工作区使用 workspace_state.py 与 .workspace
    - profile refresh 只读取目标项目的有界文本快照；Agent backend 生成 agent-task-v1，API backend 才调用 llm_structured
    - Agent 画像必须先写入 temp/research-memory/ 并经 profile schema 校验，再由 --apply-profile 原子替换现有画像
    writes:
    - projects/<name>/.research-memory/profile.json
    - temp/research-memory/*.json 与 *.txt（Agent 暂存输入/输出，不是研究记忆）
    forbidden:
    - Agent backend 导入 llm_structured、调用模型，静默吞掉 prepared task，或在失败时改写旧画像及 updated_at
    - 未经 schema 校验把暂存画像写入项目记忆
    - 自动迁移或改写既有 .research-memory 条目 ID 与文件布局
    verify:
    - python3 .scripts/test_research_memory.py
    - python3 .scripts/engineering_graph.py validate
  dsh_harness:
    preconditions:
    - dsh/ 是 API backend 的可选 cockpit adapter，不侵入 WikiGraph 确定性内核
    - 程序在 API 模式持有 turn/step 循环；当前宿主 Agent 直接调用底层工具，不进入 DSH
    writes:
    - dsh/ 运行时状态在内存（SessionLog/ToolRegistry/guard chain）
    - 不写 raw/wiki/graph.db；查询类工具经 _qa_call 直接调 query_actions，CLI 类工具经 _wg_call 调 wg.py
    - read_raw 只接受章节、行范围或页码等精确 locator；裸路径与
    - read_section 只返回一个 heading section 及该节 raw_citations，不读取整页
    forbidden:
    - 绕过 raw/ 红线直接修改知识库文件
    - 让 DSH session log 替代 raw/ 或 graph.db 作为事实源
    - 从 Agent backend 导入或调用 DSH，以 handoff 模拟当前宿主 Agent 的工作
    verify:
    - python3 dsh/test_dsh_harness.py
  dsh_tools:
    preconditions:
    - ToolDefinition 注册表仅供 API backend 使用；当前宿主 Agent 直接调用确定性入口，不消费该工具 schema
    - 每个 ToolDefinition 的 name、description 与 input_schema 会由 ToolRegistry.schemas 注入 API 模型上下文，合并视为一个运行时提示面
    writes: []
    forbidden:
    - 将 API 工具描述或 input schema 漏出提示词位置地图，或把它们错误标为 Agent/shared mode
    - 让工具描述扩张 execute_fn 的真实能力、权限或参数契约
    verify:
    - python3 dsh/test_dsh_harness.py
    - python3 .scripts/test_prompt_audit.py
    - python3 .scripts/engineering_graph.py validate
  dsh_agent_loop:
    preconditions:
    - 每个已获准的 ingest tool action 在 DSH 层只派发一次；底层 llm_structured 依 typed RecoveryPolicy 处理基础设施与输出传输恢复
    - api_timeout 等类别只用于结构化交接与运维判断，不授权 DSH 重跑整个摄入子进程
    writes:
    - 仅写内存 SessionLog；不直接写 raw/wiki/graph.db
    forbidden:
    - 因 api_timeout、429、空输出或任意错误在 DSH 层重复执行相同 ingest tool action
    - 用 DSH ingest/retry 事件或 stage counter 代替 ExecutionEvent 统计真实 API 请求
    verify:
    - python3 dsh/test_dsh_ingest_tools.py
    - python3 .scripts/test_ingest_pipeline.py
    - python3 .scripts/engineering_graph.py validate
  dsh_semantic_recovery_agent:
    preconditions:
    - 仅处理确定性清理和单次 semantic-patch Worker 后仍未解决的局部阻断语义问题
    - 输入使用事务 ID、结构化 issue、staged artifact locator/hash 与硬预算；不得复制完整事务或扩大到书目、Graph identity、Hub lifecycle
    - 专用 ToolRegistry 只注册 staged semantic/wiki/source 的有界只读工具；相同 tool+arguments 在同一任务中最多执行一次
    - 输出必须是 semantic-patch-v1 typed Proposal；程序负责应用到 staged semantic artifact、全量复验、resume 与 commit
    writes:
    - 不直接写任何文件；仅返回 AgentResult，并由调用方把脱敏 trace/预算/issue delta 持久化到 inbox transaction state
    forbidden:
    - 读写 raw/、wiki/、graph.db 或调用任何提交工具
    - 处理 API timeout/429/403、空输出、schema 错误、代码异常等非语义决策失败
    - 超过 max_turns/max_tool_calls/max_elapsed_sec，重复调用同一 tool+arguments，或在证据不足时猜测修补
    verify:
    - python3 dsh/test_semantic_recovery_agent.py
    - python3 .scripts/test_ingest_pipeline.py
    - python3 .scripts/test_ingest_paper.py
    - python3 .scripts/engineering_graph.py validate
  dsh_meeting_compiler_agent:
    preconditions:
    - 仅处理已通过会议去重的 .txt；输入为只读原始纪要、确定性人物候选、程序生成的 meeting ID/目标来源路径与本轮 validator 错误
    - API 模式运行 operation=ingest_meeting_compile，优先复用 INGEST_GENERATION profile；模型目录只作审计，运行时选择仍服从 llm_structured/.env
    - 初次编译只允许一个 Meeting Compiler execution，同时返回 meeting-compiler-v1 的转写纠错决策、实体决策、Wiki 草稿和语义槽；不得拆给多个语义 Worker，provider transport/fallback 仍由 llm_structured 受控处理
    - transcript replacements 必须逐条精确命中原文且不可级联；调用方确定性应用后生成 staged corrected.txt，并分别校验 Wiki 与语义槽
    - INGEST_BACKEND=agent 时只生成带 write_to 的同一协议 handoff；resume 必须先校验 agent 输出再恢复原事务
    writes:
    - 不直接写任何文件；仅返回 MeetingCompilerResult，调用方只可写 temp/inbox-extract 与事务状态
    forbidden:
    - 读写 raw/、wiki/、graph.db，调用落位/提交工具，或自报最终文件路径和 Knowledge IR 确定性字段
    - 猜测未出现的实体替换、接受空 Wiki/slots，或对同一原文做重叠、重复、级联替换
    - 绕过 Wiki/semantic validator、knowledge-ir-v1、graph-plan-v1 或 graph_ingest 唯一 writer
    verify:
    - python3 dsh/test_meeting_compiler_agent.py
    - python3 .scripts/test_ingest_meeting.py
    - python3 .scripts/test_ingest_pipeline.py
    - python3 .scripts/engineering_graph.py validate
  dsh_semantic_recovery_eval:
    preconditions:
    - 每类 specialist 使用独立版本化试卷；case 明确期望 resolve/abstain、允许修补与预算
    - 候选模型必须存在于 llm-models.yaml；试卷通过只更新评测报告，不自动修改 preferred/fallback 或生产 .env
    - 模型晋级同时满足质量、安全、预算、延迟和成本门槛；不得只按最终文本相似度排名
    writes:
    - temp/agent-evals/*.json（显式 --run 的脱敏逐题结果与汇总，不是事实源）
    forbidden:
    - 把 raw/、生产 Wiki 或未脱敏的用户材料复制进公开/合成试卷
    - 未跑完整版本化试卷就激活模型路由，或让被测 Agent 自行选择模型
    - 因单次模型榜单自动改写 production preferred/fallback
    verify:
    - python3 dsh/semantic_recovery_eval.py --validate
    - python3 dsh/test_semantic_recovery_agent.py
  dsh_ingest_tools:
    preconditions:
    - 图片摄入可透传显式 ocr_result 或 allow_remote_ocr；不得因 API backend 或存在 endpoint/key 而自行授权图片上传
    - DSH 摄入工具只经子进程调用 ingest_inbox/ingest_paper/ingest_meeting/ingest_document/ingest_user_assertions/re_ingest
    - ingest_user_assertions_apply 只接受 user-assertions-<hash> 事务 ID，并调用受管 apply；DSH 不直接修改 Raw/Wiki/Graph/pending
    - 论文 Agent workspace 注册 paper_workspace_read、paper_workspace_check、paper_workspace_commit、paper_workspace_refresh 四个类型化工具；均只接受合法事务 ID，refresh 仅映射 ingest_paper --agent-refresh 的显式归档刷新
    - paper_workspace_* 对外只返回 awaiting_agent、ready_to_commit、completed、failed 四种 workflow_status；原细粒度状态若需诊断仅放 internal_status
    - 保持底层脚本 quiet JSON、独立事务与返回码分支；DSH 不重写摄入状态机
    - 子进程返回码只表示命令是否完整完成，不单独决定业务失败；可解析的 agent_required/partial/graph_ready 等可继续终态必须原样返回且不得添加 ERROR 前缀
    - 会议 agent_required 必须原样保留 prompt/write_to/transaction_id；ingest_meeting_resume 只接受合法事务 ID 并恢复同一事务
    - 错误分类优先把 stdout/stderr 的结构化终态交给 inbox_state canonical failure disposition，再映射兼容 DSH 类别；仅在结构化终态缺失时使用窄关键词兜底
    - bibliographic_review_required/validation_error/classification_required 与 failed 同属工作流终态；DSH 必须原样保留 status、transaction_id、errors、retryable、next_action
    - 带 phase/items 的批量 JSON 是不可拆分的顶层工作流 envelope；结构化解析必须跳过其内部对象
    - ingest_document_file 允许 academic 子项目，但 academic 必须同时传 document_type=editorial|academic-reference|conference-summary
    - ingest_document_file 可透传程序已判定的 source_kind=ordinary|meeting；DSH 不重新解释来源种类
    writes:
    - 不直接写 raw/wiki/graph.db
    - session log 记录 tool/call 与 tool/result；不作为事实源
    forbidden:
    - 绕过 --dry-run/--run 分支直接执行摄入
    - 在 DSH 层删除 inbox 源文件或修改事务 JSON
    - 把 DSH session log 当作 raw 证据或图边来源
    - 因错误文本包含普通文件扩展名 PDF 或宽泛 extract 字样而覆盖结构化的书目/语义校验失败类别
    - 用 semantic_failed 分类替代可恢复的底层结构化终态，或诱导调用方重新执行 --pdf 创建新事务
    - 仅因子进程返回码非零就把 agent_required/partial/graph_ready 等可继续终态包装成 ERROR
    - 把批量 envelope 的 items 子项误选为顶层终态，导致逐文件状态与 transaction_id 丢失
    - 在 DSH 层替 academic 推断默认文档类型或回退到 admin
    - 丢弃 inbox 已审计的 source_kind，致使会议速记在通用文档提取路径中退化为 official-doc
    - 在 DSH 层读取或改写 workspace/事务文件来模拟 read/check/commit；必须经 ingest_paper 的结构化 CLI
    - 在 DSH 层自行移动旧 workspace 输出来模拟 refresh；必须经 ingest_paper --agent-refresh 的校验、归档与事务保存
    verify:
    - python3 dsh/test_dsh_ingest_tools.py
    - python3 .scripts/engineering_graph.py validate
  source_fingerprints:
    preconditions:
    - 图片类型复用 source_locator.IMAGE_SUFFIXES，WebP/BMP/TIFF 与 PNG/JPEG 一样以原图作为源实体，排除同名 Markdown companion 独立计源
    - 受管来源元数据使用保留后缀 .source.json，指纹重建排除该 sidecar；普通独立 JSON 来源不受影响
    - 只索引 inbox 输入或 academic/admin/teaching/business Raw 源文件；binary SHA-256 由 derivation_state.sha256_file 流式计算
    - 索引是派生缓存，raw 文件字节与路径是唯一可重建依据；private 域使用 private/source-fingerprints.db 物理隔离
    writes:
    - cross-domain/source-fingerprints.db 或 private/source-fingerprints.db
    forbidden:
    - 为回填 hash 修改任何既有 raw/source.yaml 或 paper.md
    - 将 normalized text hash 单独作为确定重复并自动合并；它只能形成二次去重候选
    - 扫描 temp/wiki/.git 或把生成物哈希当作源文件身份
    verify:
    - python3 .scripts/test_source_fingerprints.py
    - python3 .scripts/engineering_graph.py validate
  duplicate_remediation:
    preconditions:
    - canonical 与 duplicate 均为已存在 Wiki 论文页，且各自可解析到不同 Raw 包中的源 PDF
    - 两份源 PDF 的 binary SHA-256 与大小必须完全一致；默认仅 dry-run，只有显式 --apply 才执行
    writes:
    - duplicate Wiki 移入 cross-domain/duplicate-remediation/archive/ 可恢复归档
    - graph.db 删除 duplicate 页面贡献并将 duplicate Raw 路径作为 canonical Raw 节点 alias
    - cross-domain/duplicate-remediation/log.jsonl 与对应域 wiki/log.md 追加审计记录
    forbidden:
    - 修改、移动或删除任何 raw 文件或目录
    - 仅凭标题、normalized text 或 LLM 判断执行治理
    - canonical/duplicate 存在非重复 Raw 关系边时静默合并
    verify:
    - python3 .scripts/test_remediate_exact_duplicate.py
    - python3 .scripts/graph_validate.py
    - python3 .scripts/engineering_graph.py validate
  dsh_ingest_guard:
    preconditions:
    - 挂载在 ingest 工具 execute 瀑布前
    - paper_workspace_read/check/commit/refresh 四个动作必须统一校验合法事务 ID
    writes:
    - 无
    forbidden:
    - 放行 raw 路径写入、非法摄入参数或绕过 --run 的 dry-run 语义
    - 因 workspace 动作不以 ingest_ 开头而跳过 guard，或允许 refresh 接受路径穿越与空事务 ID
    verify:
    - python3 dsh/test_dsh_ingest_tools.py
  visual_qa:
    preconditions:
    - 输入是现有图片、PDF、PPT 或 PPTX；PPT/PPTX 只检查静态渲染页，不覆盖动画、视频或切换效果
    - Agent 只在用户显式要求视觉检查，或修改请求依赖布局、位置、颜色、遮挡、比例、页面流等可见状态且需先检查才能可靠理解指令时调用；常规文字修改、编译与每轮交付不自动触发
    - 视觉模型默认 GLM-5.3-Flash + VISUAL_QA_REASONING_EFFORT=low，接口或输出失败时兼容回退 GLM-4.6V；回退模型不是真值裁判，不用其 pass 覆盖主模型缺陷报告
    - shared QA 缓存绑定主/回退推理档位与 VISUAL_QA_MAX_TOKENS（默认 1800）；API-only adapter 按候选发送其独立参数，default 档省略 reasoning_effort，不继承 OCR 或文本 LLM 的推理设置
    - QA prompt-v2 仅将可见、有实际影响的缺陷列入 issues；纯审美建议放 summary，不升级 warn；不机械压制模型已报告的问题，非 stop 或拒答响应不得作为成功
    - 本次仅迁移 OCR/视觉检测；env 显式固定 VISUAL_RECONSTRUCTION_MODEL/FALLBACK_MODEL 为 GLM-4.6V/GLM-4.5V，避免可编辑 PPT 重建因继承 QA 设置而未经验证切换
    - 运行时自动读取仓库根 `.env` 并展开同文件 `${NAME}` 引用，进程环境同名变量优先；VISUAL_QA_API_BASE/KEY 可引用主 LLM endpoint/key
    - raw、inbox、私有源材料与 paper-profile 论文/稿件 PDF 默认只做本地确定性检查；只有调用方显式 allow_remote 才允许上传页面图像到远程视觉 API
    writes:
    - temp/visual-qa/<artifact-sha>/<profile>/<check-key>/ 下 manifest、逐页 receipt、渲染缓存与 summary
    forbidden:
    - 修改输入图片、PDF、PPT/PPTX、raw/wiki/graph.db 或科学数据与结论
    - 将启发式警告或视觉模型判断当作原始事实证据
    - API 失败、非法 JSON 或未检查页面时给出全局 pass
    - 将 API key、Authorization header、明文 prompt/context 或 data URL 写入 manifest、逐页 receipt、summary 或 DSH SessionLog
    - 重跑时覆盖已完成且输入、模型、prompt、schema、render 配置哈希一致的逐页 receipt
    verify:
    - python3 .scripts/test_visual_qa.py
    - python3 dsh/test_visual_tools.py
    - python3 .scripts/engineering_graph.py validate
  comic_generation:
    preconditions:
    - 调用方必须二选一提供 projects/ 下已存在研究项目，或仓库内已存在且目录名为 outputs 的显式输出根；article_id、asset_id 与输出文件名必须通过有限字符校验
    - 模型必须来自 llm-models.yaml 的 image_generation.candidates；API base/key 来自 COMIC_IMAGE_*，缺省时可引用 LLM_API_*，不得把密钥写入参数文件
    - generate/batch 的远程调用同时要求显式命令与 --allow-remote；dry-run/models 不联网
    - storyboard 只描述分镜与绘图参数，不得被当作事实证据；科学含义仍需人工审核
    writes:
    - <allowed-output-root>/<article-id>/images/ 下图片、prompts.jsonl、manifest.json 与逐次 receipt
    forbidden:
    - 修改 raw、wiki、graph.db、文章原稿、storyboard 输入或现有图片；未经 --overwrite 显式授权覆盖文件
    - 将 API key、Authorization header、base64 图片、远程临时 URL 或完整供应商响应写入输出记录
    - 未登记模型、非 HTTPS API endpoint、指向本机/内网的图片 URL、非图片响应或越界输出路径进入产物目录
    - API 失败、空图片或校验失败时报告成功，或自动切换模型掩盖失败
    verify:
    - python3 .scripts/test_comic_generation.py
    - python3 .scripts/engineering_graph.py validate
    - python3 .scripts/research_project.py validate asks-ai-agent --strict
  dsh_comic_tools:
    preconditions:
    - comic_models、comic_generate、comic_batch 只注册到显式加载该能力的 Agent ToolRegistry；不加入 query_actions 或只读 VisualAgentLoop
    - comic_generate/comic_batch 必须传 allow_remote=true 才能触发远程调用；comic_models 与 dry_run 不联网
    writes:
    - 仅通过 comic_generation 写允许的 outputs 目录；DSH SessionLog 只保留紧凑结构化结果
    forbidden:
    - 绕过 comic_generation 的模型白名单、路径保护、远程授权或覆盖保护
    - 注册到 query_actions、CitationGuard 事实查询链或自动摄入流程
    - 在工具结果或 SessionLog 中返回 API key、Authorization、base64 图片或临时远程 URL
    verify:
    - python3 dsh/test_comic_tools.py
    - python3 .scripts/test_comic_generation.py
    - python3 .scripts/engineering_graph.py validate
  dsh_visual_tools:
    preconditions:
    - visual_check 仅注册在独立 VisualAgentLoop；不加入 query_actions，也不挂接事实查询 CitationGuard
    writes:
    - 仅通过 visual_qa 写 temp/visual-qa receipt；DSH SessionLog 只记录工具调用与紧凑结果
    forbidden:
    - 因普通 PDF 摄入或事实查询意图触发视觉检查
    - 自动修改视觉产物、源文档或知识库
    verify:
    - python3 dsh/test_visual_tools.py
    - python3 .scripts/engineering_graph.py validate
  visual_to_editable_ppt:
    preconditions:
    - 输入是现有图片或 PDF；矢量 PDF 优先直接提取文字与路径，位图/扫描页才进入 OCR 与图形检测，不得无条件栅格化
    - 默认 balanced 模式以视觉忠实为先；只有高置信度可见元素转为原生文本框、线段、矩形、椭圆或自由曲线，复杂区域允许保留可追踪的局部位图 fallback
    - 远程视觉模型默认取 llm-models.yaml 登记的 GLM-4.6V，失败时回退 GLM-4.5V；敏感路径与 paper-profile 内容只有显式 allow_remote 才可上传
    writes:
    - 仅写显式 output_path 与 temp/visual-to-ppt/<artifact-sha>/<run-key>/ 下 manifest、逐页中间对象、receipt、渲染缓存、差异报告和最终装配 checkpoint
    - 输出 PPTX 使用独立原生对象；fallback 位图必须在对象 manifest 中记录范围、原因和置信度，不得伪报完全可编辑
    forbidden:
    - 修改输入图片/PDF、raw/wiki/graph.db 或科学数据与结论
    - 未经 overwrite 显式授权覆盖既有输出；把远程模型返回的路径、命令、XML 或对象 ID 直接当作可信执行输入
    - API/OCR 失败或存在 fallback 时报告百分之百可编辑；将 API key、Authorization header、明文 data URL 写入 receipt 或 DSH SessionLog
    - 因普通视觉检查、PDF 摄入、事实查询或论文阅读意图自动触发转换
    verify:
    - python3 .scripts/test_visual_to_editable_ppt.py
    - python3 dsh/test_visual_reconstruction_tools.py
    - python3 .scripts/test_visual_qa.py
    - python3 .scripts/engineering_graph.py validate
  dsh_visual_reconstruction_tools:
    preconditions:
    - visual_to_editable_ppt 只注册在 API-only VisualReconstructionAgentLoop，并要求显式源路径；当前宿主 Agent 直接调用底层能力，不经 DSH
    - 输出路径省略时只能落在 projects/visual-reconstruction/outputs/，既有文件默认拒绝覆盖
    writes:
    - 仅通过 visual_to_editable_ppt 核心能力写 output_path 与 temp/visual-to-ppt checkpoint；DSH SessionLog 只记录紧凑调用参数和结果摘要
    forbidden:
    - 从普通 visual_check 意图、摄入意图或 query/research 意图触发；自动修改源文件或知识库

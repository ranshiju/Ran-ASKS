script_contracts:
  image_ocr:
    preconditions:
    - shared 复核状态与摄入事务状态正交；completed 可与 partial/review_required 并存，非关键未决项不自动生成用户待办；已确认空白的字段可 verified，不因缺值要求补填，阻断仍以风险评估及关键字段校验为准
    - shared image-ocr-review-v1 绑定原图与正文哈希，记录风险分级、Agent/人工复核者、时间、逐字段行号和结论；风险未评估或关键字段未核对时不得进入 Wiki/图生成，普通项与非关键未决项保留警告
    - OCR CLI --review-file 只附加本地复核记录，不调用模型；Agent 转写后可交接独立复核任务，API 摄入缺复核记录时明确停止而不隐式切换 backend
    - API 主模型 GLM-5.3-Flash 使用 IMAGE_OCR_REASONING_EFFORT=low，兼容回退 GLM-4.6V 默认不传 reasoning_effort；独立 IMAGE_OCR_MAX_TOKENS 默认 8192，参数写入新回执，旧回执仍可源绑定复用
    - shared 内核只验证图片、源 SHA-256、OCR 文本与回执；API-only adapter 必须显式 allow_remote，不借用 DSH 或 llm_structured 控制循环
    - IMAGE_OCR_MODEL 与可选 IMAGE_OCR_FALLBACK_MODEL 选择固定模型；endpoint/key 默认复用 LLM_API_BASE/LLM_API_KEY，进程环境优先，不自动发现或提升模型
    - Agent 摄入默认生成 image-ocr-v1 暂存任务；也可显式提供已生成的 OCR 回执，两者均经同一源绑定校验，不隐式回落到 API
    writes:
    - 独立 CLI 仅写 temp/image-ocr 或外部非 raw/wiki 路径的 OCR JSON 回执，不修改原图
    - 摄入阶段只在事务暂存区生成 Markdown companion；原图和 companion 由既有 manifest/validator/commit 受管落位
    - shared 图片摄入将原图与 Markdown 视为同一 Raw 来源；沿用 document-source-context-v1 sidecar 持久化配对文件名、原图/正文哈希、OCR backend/model/协议/生成时间与待复核状态，不向转写正文插入工程元数据
    forbidden:
    - 未授权远程上传、把截断或空 OCR 当成功、按文件扩展名判定会议来源、从手写签名猜测身份
    - 将 key、Authorization、data URL 或 provider 错误正文写入回执和日志
    - 把 OCR 回执或 temp 文本当作最终事实源，或绕过摄入事务直接写 Raw
    verify:
    - python3 .scripts/test_image_ocr.py
    - python3 .scripts/test_inbox_plan.py
    - python3 .scripts/test_ingest_document.py
    - python3 .scripts/test_ingest_pipeline.py
    - python3 .scripts/engineering_graph.py validate
  workspace_state:
    preconditions:
    - 目标路径必须解析到 projects/ 内已存在的工作区，允许嵌套子工作区；初始化时目标目录须已存在或由命令创建
    - profile 与字段 schema 来自 workspace-profiles.yaml；状态转换和记忆时效规则在任何入口写入前由共享 validator 校验
    - role_work 提案仍是普通事项；proposal_status 只允许 pending_submission、pending_discussion、discussed，并由 proposal 命令确定性映射通用 state 与必填执行字段
    - profile refresh 只读取目标工作区的有界快照；Agent backend 生成 agent-task-v1，API backend 才调用 llm_structured，二者经同一 profile schema 后原子替换画像
    writes:
    - projects/**/workspace.yaml、.workspace/items/*.md、.workspace/memories/*.md、.workspace/events.jsonl
    - projects/**/notes/status.md、.workspace/profile.json、.workspace/index.sqlite（均为可重建投影）
    - temp/workspace-state/*.json 与 *.txt（Agent 暂存输入/输出，不是工作区事实源）
    forbidden:
    - 修改 raw/wiki/cross-domain/graph.db，或把工作区记录当作机构事实而不引用 Raw/Wiki locator
    - 父工作区隐式召回子工作区记忆或正文；父层只能聚合子工作区公开状态摘要
    - 静默忽略无法解析的事项、记忆或事件，使用中心顺序号生成新 ID，或让派生索引成为唯一状态源
    - Agent backend 导入 llm_structured、调用模型，或未经共享 schema 校验覆盖旧画像
    verify:
    - python3 .scripts/test_workspace_state.py
    - python3 .scripts/test_research_memory.py
    - python3 .scripts/test_wg.py
    - python3 .scripts/engineering_graph.py validate
  ingest_inbox:
    preconditions:
    - 底层摄入 stdout 可同时包含进度文本、图报告嵌套 JSON 与最终工作流 JSON
    - 批量工作流必须把带 phase/items 的顶层 envelope 作为结构化终态；不得让 items 内的单文件 status 覆盖顶层 partial/completed
    - dry-run 与 --run 在任何提取/API 调用前查询可重建 source_fingerprints 索引；二进制 SHA-256 精确命中直接返回 duplicate_found 与既有 raw_path
    - 非空 facts-pending.md 必须按 inbox_plan 的 user-assertions 类型出现在 dry-run；--run 调用受管 user-assertions 事务，不得误分为普通 Markdown、静默跳过或交给 Agent 手工跨层写入
    - --run 的二进制 SHA-256 精确重复只有在既有 Raw 路径仍位于 raw/ 且双方哈希复核一致后才写清理回执并移入可恢复废纸篓；近似重复和复核失败不得自动清理
    - PDF/TXT 先由程序返回 type/score/threshold/markers/confidence；PDF 1/2/3 分、TXT 1/2 分视为不确定，仅在 --run 时调用 ingest_type_review
    - 文件扩展名只决定提取器，不得单独决定来源种类；admin 文档命中文件名或正文中的强会议速记标记时，必须把 transcript 来源判定显式传给通用文档摄入并记录在分类审计中
    - API 分类裁决的中/高置信度具体类型可覆盖程序的不确定初判；ambiguous、low 或 API 失败均在事务前返回 classification_required 由用户兜底
    - 分类 evidence_quotes 必须可回溯 review_text；validator 以 Unicode NFKC 与连续空白折叠后的文本做包含校验，允许 PDF 抽取造成的换行差异，但不得接受增删实词后无法定位的概述
    - academic 域的非论文文档在专题导言/特邀编辑/本期专题等强信号命中时自动分类为 editorial；文件名或正文首个 H1 同时包含会议实体词与事务记录词时自动分类为 conference-summary
    - 单个 --file 可用 --document-type 显式选择 academic 通用文档类型；该选择覆盖基础 paper/document 初判并保留 program_file_type 与 explicit 来源审计，批量或非 academic 调用拒绝该参数
    - 全库缩写/人物/Hub 收尾只在本次至少一个文件 completed 时执行；全 classification_required/全失败/仅精确重复直接返回紧凑终态
    - 直接 paper/meeting/document resume 成功必须调用同一 maintenance 入口；DSH 在文件 completed 时仍须保留 actionable maintenance handoff
    - 直接 resume 成功但 inbox 仍有待处理业务文件时只返回 maintenance deferred；最后一个文件完成后才运行一次全局 maintenance
    - 缩写 resolver 只读 abbreviation backlog 限定的 token/page，以 JSON 返回自动消解与类型化 Agent 候选；occurrence 按 field 绑定 subject/object 真实端点，canonical page path subject 不进入待办，待办按 page/field/端点/token/locator 去重并原子替换
    - 缩写维护摘要必须分别报告 remaining_tokens 与 remaining_occurrences；Agent 决策携带 maintenance receipt 时，apply-decisions 原子更新待办后必须闭环对应回执且保留其他未完成 component/action
    - Hub 收尾对达标新 Hub 与成员超限、无子 Hub且通过稳定二分闸的既存 Hub 返回有界 agent handoff；主 Agent 生成 canonical 定义后才允许 apply
    - Hub 收尾仅汇总本批 graph_report.hub_dynamics.affected_nodes 做增量只读 check；120 秒超时返回 retryable maintenance deferred 与 retry_hub_maintenance，不得改写 completed 文件终态
    - maintenance 输入中的每个 completed 结果必须保留真实完整 graph_report；缺失或裁剪的结果 envelope 必须显式 validation_error，不得按 no_affected_nodes 返回 Hub 无动作
    - route-apply 已写入 hub_scope_route_current=resolved/agent_confirmed_override 后，后续 maintenance 重算必须视该论文路由为已闭环，不再重复生成同一 route-review handoff
    - shared 首次摄入与 resume 发布维护报告时，须把同一 receipt_path/report_path 关联到所有已完成事务；route-apply 按事务闭环共享待审清单、回执和报告，保留独立质量告警及其他待审动作
    - 共享回执是维护语义状态来源；方向闭环及历史重放完成后须同步同批全部已完成事务的维护快照，不能只更新最后裁决的事务
    - shared 维护发布先在报告写 pending 检查点，再同步事务，最后写 completed 发布状态；中途 I/O 失败保留可重试 publication error 和原文件终态，--reconcile-maintenance-report 从共享回执继续，不重跑摄入或全局维护
    - 实际摄入前在 stderr 报告生效 backend；紧凑 stdout 保留 backend、质量告警总数及最多 5 条有界摘要，不为查看降级原因要求 Agent 输出完整图报告
    - --reconcile-maintenance-report 仅修复显式指定的受管历史报告关联，并重放事务中已有的方向裁决以闭环回执；不调用模型、不重摄入、不写 Raw 或图，不产生新语义裁决
    - 报告单独统计 awaiting_agent 与 duplicates；failed 只统计真实失败，agent_required 不得触发失败退出码
    writes:
    - temp/inbox-dsh/*.jsonl
    - cross-domain/ingest-reports/*.json（含 program classification 与 boundary API review）
    - cross-domain/source-fingerprints.db（只存可由 Raw 源文件重建的派生指纹索引；不作为事实源）
    - temp/hub-auto-create/*.json、temp/hub-auto-split/*.json 与 temp/hub-auto-redistribute/*.json（主 Agent 的候选交接文件，不是事实源）
    - temp/abbreviation-review/*.json 与 temp/inbox-maintenance/*.json（Agent 候选与维护回执，不是事实源）
    - temp/inbox-duplicate-receipts/*.json（精确重复复核与可恢复清理回执，不是事实源）
    - cross-domain/abbreviation-todo.jsonl（精确 token 的原子去重维护待办）
    forbidden:
    - --run 时把底层完整 stdout、逐节点 Hub 候选或完整 graph_report 再打印给 Agent；这些诊断只进入持久化报告/DSH log
    - 持久化报告缺失 graph_report 等底层已返回诊断，或紧凑 stdout 不返回 report_path
    - 将 Hub/page 等领域对象的 active/current/retired 状态误判为摄入工作流状态
    - 用全库维护的 agent_required/error 覆盖当前文件的 completed/classification_required 终态；紧凑 stdout 必须分别返回 file_status 与有界 maintenance 摘要，完整候选留在 temp 文件与回执
    - 解析缩写 resolver 的自然语言 stdout、吞掉 timeout/非零退出/无效 JSON，或允许 Agent 裁决 backlog 外 token
    - 把 occurrence 数伪装成唯一 token 数，或在决策已成功应用后让对应 maintenance receipt 永久停留在 agent_required
    - 忽略 graph_report.hub_scope_route_current 中已确认的 resolved 路由，导致同一论文在每次 resume 时重复产生 route-review
    - 让 API LLM 自动决定 Hub title/Scope/parent，或绕过 split-apply --agent-confirmed 的 Scope 区分度与路由探针
    - 在存在多个 JSON 对象时选择最终工作流结果之前的嵌套 status 对象
    - 逐字符把已解码顶层对象内部的嵌套 status 再次当作独立工作流终态
    - 丢弃 bibliographic_review_required/validation_error 等底层终态、transaction_id、errors、retryable、next_action，或只返回宽泛 semantic_failed
    - receipt 已 committed 且最终工作流为 completed 时汇总为 failed
    - academic 非论文文档未取得合法分类时继续调用摄入工具、预处理或写入任何 raw/wiki/graph.db
    - 对高置信度分类或 dry-run 调用 API 分类器，或不记录 API 裁决便改写程序路由
    - 因 .docx/.doc/.pptx 扩展名直接将会议速记标成普通 official-doc，绕过 transcript 的来源类型与置信度约束
    - 将非空 facts-pending.md 报告为无待摄入文件、按普通 document 分流，交给 Agent 手工改 Raw/Wiki/Graph，或在专用原子事务提交前清空该文件
    - 未复核 Raw 路径与双方 SHA-256 就自动清理重复文件，或对非精确重复执行清理
    verify:
    - python3 .scripts/test_ingest_inbox_dispatch.py
    - python3 dsh/test_dsh_ingest_tools.py
  engineering_graph:
    preconditions:
    - 建设目标可以是 capability/canonical node ID，也可以是唯一映射到已注册节点的精确 path、文件名或 stem
    writes: []
    forbidden:
    - 已知 graph.yaml node/contract/capability pointer 时仍要求 Agent 先枚举整个 YAML locator 列表
    - 根据工程节点名猜测具体 Python symbol；代码只提供 filtered-list 入口，由 Agent 按施工意图选择
    - 接受未注册路径、模糊匹配或有多个候选的文件名/stem；歧义必须列出 canonical node 候选并停止
    verify:
    - python3 .scripts/test_prompt_audit.py
    - python3 .scripts/engineering_graph.py validate
  lint_specs:
    preconditions:
    - 项目提示面包括总提示词、route/capability 派发规范、Agent/Skill/记忆指令、按需读取的工程指南、候补策略与模板资源、LLM 可见契约、YAML prompt 字段与生产代码中的运行时提示词
    - API ToolDefinition 的工具描述与 input schema 会随工具定义注入模型上下文，按单个工具作为 API runtime-prompt 提示面纳入位置地图
    - 契约是独立约束源；仅实际注入或明确供 LLM 读取的契约内容标记为 LLM 可见提示面，机器 Schema、类型、校验器与测试本身不计为提示词
    - 位置地图记录直接 governed_by 上位关系并校验引用与无环性，审计按关系图先总后分；程序负责生成地图，语义审查由当前 Agent 或 API 模式下的受控执行单元完成
    - 运行时提示面的 mode 按具体符号、调用位置与 engineering node role 判定；同一混合文件中的 Agent builder、API builder 和共享 contract 可以具有不同 mode，不得仅按目录归类
    - 默认、API backend 和非 Agent-build 上下文生成完整七项语义审查；只有显式同时指定 --task build --backend agent 才启用 trusted-agent-build，task/backend 参数必须成对提供
    - trusted-agent-build 保留提示词位置地图及仓库路径、governed_by 引用、拓扑无环、位置字段和 mode 的确定性检查，返回 structural_only 与 semantic_review.status=skipped，criteria/review_rules 为空；检查状态必须由当次验证结果计算，无法机械证明的提示面完整性须报告 unknown
    - 生产代码中的运行时提示优先关联同一工程节点的 LLM 可见 script_contract，再由该契约关联 capability 或总提示词；领域模板同时关联任务规范与对应 Schema
    - 冗余审查同时精简解释性重复和目标 Agent 已稳定具备、且不影响本项目判断与执行的通用常识；保留项目特有规则、反直觉边界、已知易错点和验收条件
    - 版本一致性审查以当次 governed_by 上位 capability/task/script_contract 和当前 CLI、Schema/validator、组件责任边界为依据，识别已退役命令、参数、路径、角色、流程与旧架构约定；文件签名与 SHA-256 只证明扫描内容新鲜，不证明提示语义仍适配当前版本
    - 提示词位置提取按源文件增量缓存；元数据签名未变时直接复用，签名变化时读取内容并以 SHA-256 复核，内容变化时重新解析，删除时移除缓存项，扫描器版本变化时整体失效；governed_by 与拓扑顺序每次基于当前位置全量重算
    writes:
    - temp/prompt-audit/map-cache-v1.json（可由生产代码与 YAML 提示面重建的增量位置缓存，不是审计事实源）
    forbidden:
    - 扩展为通用文风评分、历史注记扫描或自动改写器
    - 仅扫描 Markdown 规范而遗漏 Agent/记忆/YAML/运行时代码提示词及 API 工具描述/schema，或把测试夹具、执行 trace 与不注入模型的机器契约登记为提示词
    - 把同义文字机械判为矛盾，或把不同运行上下文中的必要自包含表述机械判为重复
    - 仅凭文件日期、mtime、缓存命中或内容哈希判定提示词符合当前版本，或在未核对实际接口与责任边界时把语义审查标记为通过
    - trusted-agent-build 生成语义审查标准、审查规则或改写建议，或把跳过语义审查表述为审计通过
    - 以硬编码 passed 或位置记录自带的 llm_visible=true 证明扫描完整性、可见性或边界正确
    verify:
    - python3 .scripts/test_prompt_audit.py
    - python3 .scripts/engineering_graph.py validate
  route:
    preconditions:
    - 已判定 task；ingest 必须提供 subproject 与单个 stage；会议纪要须传 source-kind=meeting；query 按当前阶段传 query-stage
    - 持续工作上下文使用 --task；状态内按需规范使用 --capability；当前宿主 Agent 直接调用受管脚本或 wg.py，API backend 可经 DSH ToolRegistry
    - build 从 capability guardrails 渲染简洁的 WikiGraph 方法哲学与信息入口；工程细节由 impact 推荐 locator 按需加载
    - build 处理缺陷时须在首次编辑前明确说明，并以复现、代码路径或反事实建立和验证从症状到责任组件的因果链；默认修复责任组件并在该边界回归，局部补偿只用于明确的边界外根因、兼容性、迁移或历史数据修复
    writes: []
    forbidden:
    - 绕过路由凭记忆选规范
    - 把 capability 调用当作 task/state 切换，或把提示规范能力伪装成已执行工具
    - build 路由重复展开 shared-conventions 或 code-guidance 正文，把总提示词变成工程手册副本
    - 用重复的禁止事项和流程细节挤占方法判断
    - 按当前 Agent/API backend 缩小 shared 修复范围，或只用 prompt 补丁掩盖确定性共享层缺陷
    - 向 query、ingest、inbox 等非 build 使用任务派发模型后端兼容性门
    - query 后续阶段重复注入 start 固定上下文（工程上下文、执行纪律、任务边界、经验触发）
    verify:
    - python3 .scripts/test_prompt_audit.py
    - python3 .scripts/engineering_graph.py validate
  engineering_locator:
    preconditions:
    - 建设任务 Agent 已定位仓库内的文本型工程文档、配置、代码或测试；Raw/Wiki 仍使用各自专用 locator
    writes: []
    forbidden:
    - 读取 raw/、wiki/、graph.db、二进制文件或仓库外路径
    - locator 失效或片段超预算时静默回退全文或返回半截片段
    - 为所有工程文件建持久索引、companion 或缺失 locator 审计
    - 仅注册工具但让 build 路由和 impact 输出继续默认引导 cat/sed/全文读取
    - list 已提供 prefix 时仍枚举、计数或截断未命中前缀的 locator
    verify:
    - python3 .scripts/test_engineering_locator.py
    - python3 .scripts/test_prompt_audit.py
  build_locator_tools:
    preconditions:
    - 仅供 API backend 建设任务使用；当前宿主 Agent 直接调用 engineering_graph/engineering_locator，不进入 DSH
    - 不进入 query_actions 或查询型 DSH 工具面
    - 工具面只暴露 impact、精确 read、filtered list，不暴露裸 cat/sed 或工程全文读取
    - engineering_locator read/list 仍由底层工具执行预算、路径和格式校验
    - impact target 原样透传 engineering_graph，可用 capability/canonical node ID 或唯一已注册路径别名
    writes:
    - 会话内 build locator guard 状态与 session log
    forbidden:
    - 在未完成 engineering_graph impact 前放行 locator read/list
    - list 无 prefix 时仍执行或放行
    - 将 locator 工具注册为通用 query DSH capability
    - 读取 raw/、wiki/、graph.db、二进制文件或仓库外路径
    verify:
    - python3 dsh/test_build_tools.py
    - python3 .scripts/test_engineering_locator.py
    - python3 .scripts/engineering_graph.py validate
  graph_validate:
    preconditions:
    - graph.db 已存在；operations/config/graph-schema.yaml 可解析
    writes: []
    forbidden:
    - 修改 graph.db、页面或 raw
    - 把缺失 edge locator 或 edge_evidence 作为约束违反
    - 把历史 semantic address/description 缺失升级为全库阻断；须聚合 WARN 并交迁移工具处理
    - 忽略 dangling node_origins/managed_nodes、非 entity managed node 或 managed node 缺创建页 origin
    verify:
    - python3 .scripts/test_graph_validate.py
  graph_metrics:
    preconditions:
    - graph.db 已存在；巩固阈值只用于产生候选，不代表自动写入授权
    writes: []
    forbidden:
    - 根据 degree、来源页数或 Hub 成员数自动创建、更新或删除 Wiki/Graph 对象
    - 把 source-local proposition 达到长度或单次出现直接判为 promoted claim
    verify:
    - python3 .scripts/test_graph_metrics.py
  graph_repair:
    preconditions:
    - 已备份或确认可按 dry-run 计划修改 graph.db
    - description-audit 只检查 keyword 主描述、逐来源 gloss 与现有 Wiki/Raw lineage，输出选择性 re-ingest 清单；不从标题或图邻居生成描述
    writes:
    - cross-domain/graph.db
    forbidden:
    - 修改 raw、wiki 页面
    - 未指定 --apply 时静默写入
    - 未显式给出 exact --orphan-node，或目标仍有关系边/时态事实、类型不是 entity 时删除节点
    - 为缺失 locator 自动猜测 Raw 行号、回填 edge_evidence 或降级 confidence
    - description-audit 修改 graph.db、Wiki 或 Raw，或把缺少 Raw 来源的页面列为可自动修复
    verify:
    - python3 .scripts/test_graph_repair.py
    - python3 .scripts/graph_repair.py --raw-links-only --dry-run
  keyword_description_backfill:
    preconditions:
    - 候选仅限 description 缺失或确定性无效的 keyword；有效非空主描述不得进入回填
    - 每条候选必须由程序从既有 Wiki lineage 选择可校验 Raw locator 并读取为证据卡；生成 worker 只按候选 id 返回一句局部说明与 evidence id，独立复核 worker 再检查逐项证据一致性
    - path/title 的数字、年份、通用符号、重复 title 与中英拼接潜在重复身份必须先转 identity review；描述沿用 Raw 证据主语言，英文技术词组、符号和公式不得翻译
    - 默认 dry-run 只报告；--apply 时 API backend 执行两阶段模型调用，Agent backend 先生成单批 agent-task-v1，待受控结果文件通过相同 schema 与证据校验后才写图
    writes:
    - cross-domain/graph.db 的 node_glosses、node_description_reviews，以及仅对缺失/确定性无效主描述的 nodes.description 提升
    - temp/llm-events API 审计日志
    - temp/keyword-description-backfill/*.json（Agent 输入批次与待校验输出，不是事实源）
    forbidden:
    - 修改 raw、wiki、Hub Scope、知识边或节点身份
    - 让 API worker 生成 locator、候选外节点或无证据描述
    - 覆盖已有有效 nodes.description，或在 Raw locator 无效/读取为空时写入 gloss
    - API/Schema 失败后以标题、Hub seeds、图邻居或模型常识猜写 description
    - Agent backend 导入 llm_structured、调用模型，或把 prepared task 持久化成 generator_failed/review_failed
    - 未经显式 --retry-rejected 重复尝试同一 Raw locator 上已 abstain、生成校验失败或复核拒绝的候选
    verify:
    - python3 .scripts/test_backfill_keyword_descriptions.py
    - python3 .scripts/graph_validate.py
  open_source_release:
    preconditions:
    - 每次有实际公开变更的 GitHub 同步先由当前 Agent 评估 PATCH/MINOR/MAJOR 并说明功能与兼容性依据，不按文件数/行数推断；脚本 prepare-version 按显式级别与预期旧版本计算新版本，同次构建重试不重复排号
    - 根目录 VERSION 是当前 MAJOR.MINOR.PATCH 发布边界；verify 对比公开仓库的待提交或最新提交基线，拒绝同版本或版本倒退的公开更新；Git tag/Release 的创建与版本排号分别授权
    - 根目录 CHANGELOG.md 由公开资产生成，且最新版本标题与 VERSION 一致
    - 每次 GitHub 公开树更新均须内容级审阅并同步英文 README、中文 README、带日期的中文说明 Markdown 及其版本范围说明；相关机制、能力、配置或使用方式不得只写 changelog
    - 中文说明 Markdown 是 GitHub 默认在线阅读入口，图片使用公开相对路径；PDF 保留用于下载和打印，在读者内容变化时从同一已审阅来源同步更新
    - 中文说明 PDF 在进入公开资产前已经过 Ghostscript 标准化并完成逐页渲染对比；Word/Quartz 原始导出只作为生成输入
    - 中英文 README 公开资产均存在，包含双向语言入口与公开联系邮箱
    - 公开 capability 的 required 节点均存在于 allowlisted 目标树；active projects/.project 路径只保留在私有工程图
    - 个人 Codex 技能入口按 manifest 显式排除；active projects 工作区继续由公开 allowlist 的既有边界隔离
    - 已发布的冻结 paper-artifacts 版本全部保留，并分别通过其声明的版本化验证器
    writes:
    - build 写入指定目标公开树（目标绝不能是 REPO 自身）
    - prepare-version --apply 仅同步源 VERSION、公开资产 CHANGELOG 和根目录 CHANGELOG 镜像，将 Unreleased 条目归入新版本并记录判断依据；缺省只输出计划，不调用 LLM 或 Git 网络
    - 目标树中的 operations/engineering/graph.yaml 确定性投影，仅保留公开路径闭包
    forbidden:
    - 手工向生成公开树补入业务文件
    - 将 manifest 声明为私有的个人 Codex 技能或 active project 内容复制到 GitHub 公开树
    - 将 active projects/.project 节点、依赖边、验证命令或脚本契约复制到公开工程图
    - VERSION 缺失、非 semver，或 README release badge 与 VERSION 不一致时仍验证通过
    - CHANGELOG.md 缺失当前 VERSION 标题时仍验证通过
    - 只更新英文 README 的版本标记，造成中英文版本信息漂移
    - 公开代码、规范或能力已变化，但本次 Git diff 未同时更新中英文 README、中文说明 Markdown 与版本范围说明
    - README 把 PDF 预览器作为中文说明的默认阅读入口，或中文说明正文变化后未同步下载/打印 PDF
    - 将未经标准化和渲染对比的 Word/Quartz PDF 直接发布到 GitHub
    - 目标 `.gitignore` 隐藏白名单文件，导致生成树通过但 Git 提交缺件
    - 把管线 CURRENT_PIPELINE_VERSION 当公开发布版本
    verify:
    - python3 .scripts/test_open_source_release.py

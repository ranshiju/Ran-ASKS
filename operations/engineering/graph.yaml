capabilities:
  ingest:
    entry: route
    required:
    - agents
    - ingest
    - schemas
    - graph_ingest
    - ingest_check
    optional:
    - llm_structured
    - recovery_policy
    - api_ingest
    - experiences
    - experience_recall
    - direction_matcher
    - cluster_keywords
    - ingest_build
    - ingest_plan
    - long_document_plan
    - derivation_state
    forbidden:
    - triples_legacy
    guardrails:
    - 按 stage 执行：先编码落盘，再巩固建图，最后校验/日志；不得跳 stage。
    - 关系和 keyword 先有 raw/wiki 证据；graph.db 是当前边主数据，禁用 Markdown triples 主路径。
    - 每个改动页必须 ingest_check；ERROR 清零，WARN 向用户提示。
    - INGEST_BACKEND=api 时 ingest_paper.py 内部通过 call_text() 调用 API LLM 撰写 wiki 与语义槽；api_ingest.py 仅用于证据卡受限场景，非 inbox 论文主入口。hybrid 模式已删除，INGEST_BACKEND 只接受 agent|api。
  query:
    entry: route
    required:
    - agents
    - query
    - query_graph
    - query_orchestrate
    optional:
    - query_actions
    - node_semantics
    - graph_dump
    - experiences
    - experience_recall
    forbidden: []
    guardrails:
    - 图、Hub、Navigation 只定位；事实性结论从相关 Wiki section 的脚注下钻 Raw；edge locator 有则可用、没有也合法。
    - 先读 Navigation，再按需读 Content/raw；同一 action key 不重复执行。
    - 续查必须有具体缺口和候选；无候选时限定性回答，不无限回环。
    - route 的 query 先派发 start；候选定位后才取 evidence，有具体缺口才取 continue，交付前取 answer。
    - start 阶段无固定检索策略时应先记录轻量检索策略；API 首轮 discover/read 必须提交 drafted 或 skipped 策略。
  hub:
    entry: route
    required:
    - agents
    - hub
    - graph_ingest
    - hub_semantics
    optional:
    - graph_metrics
    forbidden: []
    guardrails:
    - Hub 是 keyword、proposition、People page 等普通节点形成的可重叠动态群落；arXiv 方向只提供初始化 Scope，不是成员或身份定义。
    - People page 以可定位人物画像参与；研究者写研究对象/问题/方法，行政人员写职责/服务范围，学生写学习或研究阶段/关注方向，其他角色写与导航相关的实际活动范围。
    - 代码负责类型感知 profile、semantic+structural affinity、membership、原型、new/split/merge candidate 与 query probe；未归类或歧义是正常状态。
    - 普通 membership 是可重建导航状态，可由程序自动更新；inbox 收尾把达标新 Hub 与稳定超限分裂候选交给主 Agent，只有主 Agent 可确认 title、Scope、parent 及 create/split/merge canonical 语义。
    - 节点数量变化只触发动力学检查；分裂与合并须有分布变化、迟滞和 query utility 证据，单一 embedding 分数不得触发生命周期写入。
  build:
    entry: route
    required:
    - agents
    - route
    - engineering_graph
    - engineering_locator
    optional:
    - conventions
    - guidance
    - handbook
    - experiences
    - experience_recall
    - graph_lib
    - graph_ingest
    - query_graph
    - ingest_check
    - prompt_test
    - graph_validate
    - graph_repair
    forbidden:
    - triples_legacy
    guardrails:
    - 以事实、代码和专业工程判断为准，不迎合用户预设；若目标与证据或工程现实冲突，明确说明判断与依据。
    - WikiGraph 以 Raw 为事实层、Wiki 为面向理解且桥接 Raw 的语义层、graph.db 为发现与到达所需的关键导航边；事实结论始终可回溯 Raw。
    - Agent 模式由当前宿主 Agent 持有控制循环，程序只提供确定性代码壳、agent-task-v1 与机械校验；API 模式由程序持有控制循环，DSH、模型调用、重试和预算只存在于 API adapter。二者共享输入解析与定位、schema、validator、IR/Graph、报告与事务等确定性内核，不共享控制循环或语义执行 adapter。
    - 提示词撰写原则：以正向、直接、可执行的要求为主，说明目标、行动与验收条件；否定表述仅用于红线和必须明确的边界。
    - 优先实际效果、最小机制、单一事实源、可重建派生物和局部且规模不变的改动。处理缺陷时，在首次编辑前明确说明并用复现、代码路径或反事实验证因果链：症状 → 最早错误状态 → 产生机制 → 责任组件；默认修复责任组件，并让回归测试覆盖该责任边界。
    - 只有根因位于当前系统边界外，或问题确认属于兼容性、迁移或历史数据修复时，才采用局部特判、兜底或事后补偿；须限定适用范围和退出条件，并验证不会掩盖其他错误。
    - 工程图只负责定位影响，工程文档只在当前判断需要时按 locator 读取。先运行 impact <target> --verify，再从推荐 locator 获取最小充分信息，不把总提示词当工程手册。
    - 完成实现、针对性回归和受影响文档同步；涉及模型后端时确认实际 backend，标记 shared、agent-only 或 api-only，并保持共享契约跨后端一致。
  lint:
    entry: route
    required:
    - agents
    - lint
    - lint_specs
    - graph_metrics
    - ingest_check
    optional:
    - graph_dump
    - graph_validate
    forbidden: []
    guardrails:
    - Lint 负责发现和报告，不因发现问题自动扩面修复。
  sync:
    entry: route
    required:
    - agents
    - sync
    - graph_metrics
    optional:
    - graph_dump
    forbidden: []
    guardrails:
    - 按增量、补漏、一致性三层对账；不一致必须报告，不静默猜测。
  write:
    entry: route
    required:
    - agents
    - write
    optional:
    - physics_manuscript_editing
    - experiences
    - experience_recall
    - comic_generation_ops
    - comic_generation
    - dsh_comic_tools
    forbidden: []
    guardrails:
    - 对外主张先取可追溯证据；不把未核验知识库内容写成事实。
    - write 是按需落笔能力；academic profile 在 research 状态内组合共享约定与学科 overlay，不切换研究上下文。
  research:
    entry: route
    required:
    - agents
    - research
    optional:
    - write
    - physics_manuscript_editing
    - workspace
    - workspace_state
    - research_memory
    - research_project
    - frontier_spec
    - frontier
    - comic_generation_ops
    - comic_generation
    forbidden: []
    guardrails:
    - 研究内容不入库（独立于 ingest）；记忆绑定到 projects/<name>/.research-memory/。
    - 进入研究项目先 recall 恢复上下文；研究过程自动保存记忆（decision/insight/literature_judgment/research_direction）。
    - research 是持续工作状态；只有实际起草、改写或润色时调用 academic write 能力，查询、实验与状态汇报不加载写作能力。
    - 产出限于研究笔记和论文文稿；不自动摄入知识库。
    - 用户显式要求 API 绘图时可调用 comic_generation；生成物只写研究项目 outputs，不进入 raw/wiki/graph.db。
  frontier:
    entry: route
    required:
    - agents
    - frontier_spec
    - frontier
    optional:
    - wg
    - query_actions
    - llm_structured
    forbidden: []
    guardrails:
    - Frontier 是独立研究前沿 overlay；只单向引用 Raw/Wiki/Graph，不修改事实层。
    - 每个捕获问题写入或精确复用单一 Question Page；库内回答只用紧凑 Graph→Wiki→Raw 证据包，支持结论必须引用包内 Raw locator。
    - Question fact_links 只固化问题来源与 supported_claim 实际引用，不固化一次召回的低相关候选。
    - 用户问题先查库、查重和评估 kb_state；模型不可用或回答失败时保留 captured/pending，active 必须人审，scientific_state 不自动更新。
    - Graph 稀疏导航；相似关系与 AI 推导默认 candidate，不自动建正式边。
  scan:
    entry: route
    required:
    - agents
    - scan
    optional: []
    forbidden: []
    guardrails:
    - 扫描只分类和报告候选；未获执行授权不移动或摄入文件。
  inbox:
    entry: route
    required:
    - agents
    - inbox
    - inbox_finalize
    - inbox_ingest
    - ingest_paper
    - ingest_document
    optional: []
    forbidden: []
    guardrails:
    - 全文只读一次：先入临时区提取文本，单遍完成归类/命名/wiki 编译；不为分类和 wiki 分别读全文。
    - sources 前置决策：撰写时直接填最终 raw 路径，落位即正确；不留占位、不后置替换；临时区路径不得入正式 sources。
    - 落位只接受 manifest 声明的实体文件；目标冲突失败，提交和 cleanup 仅作用于当前临时项。
    - 全论文批量只允许 prepare 有界并发；graph commit 保持串行且继续受 graph_ready 屏障约束。
    - 非阻断语义降级必须进入逐文件状态与持久化报告，不得仅以 completed 掩盖。
    verify:
    - python3 .scripts/test_inbox_finalize.py
    - python3 .scripts/test_prompt_audit.py
    - python3 .scripts/engineering_graph.py validate
contracts:
- id: route-capability-coverage
  nodes:
  - route
  invariant: route.py 的每个 task 都有同名 capability，能力包入口均为 route。
  checks:
  - route_task_coverage
- id: graph-write-boundary
  nodes:
  - graph_ingest
  - graph_lib
  - graph_db
  - triples_legacy
  invariant: graph.db 是当前边主数据；graph_ingest 是增量写边入口，rebuild_triples 仅兼容派生。
  checks:
  - graph_entrypoints
- id: ingest-closure
  nodes:
  - ingest
  - schemas
  - graph_ingest
  - ingest_check
  - ingest_build
  invariant: 摄入须按编码、巩固、收尾闭环；规则变更必须有局部校验与派生同步入口。
  checks:
  - ingest_capability_contract
- id: raw-redline
  nodes:
  - agents
  - ingest
  - inbox
  invariant: raw 是事实层；摄入先归档，再生成派生 wiki/图，不把 raw 作为脚本改写目标。
  checks:
  - raw_redline_text
- id: workspace-state-authority
  nodes:
  - workspace
  - workspace_profiles
  - workspace_state
  - research_memory
  invariant: 工作区配置、事项和记忆 Markdown 是权威；events 是审计历史，status/profile/SQLite 是可重建投影；旧研究记忆入口只提供兼容访问。
  checks:
  - workspace_state_authority

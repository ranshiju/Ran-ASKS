    verify:
    - python3 .scripts/test_ingest_user_assertions.py
    - python3 .scripts/test_wg.py
    - python3 .scripts/engineering_graph.py validate
  knowledge_ir:
    preconditions:
    - 所有 paper/meeting/document 类型在进入 GraphDelta 前统一编译为 knowledge-ir-v1；类型 prompt 与语义槽格式可不同
    - IR document.profile 由 Wiki frontmatter/path 确定性推导，不由 LLM 自报；relation 保留 canonical 标记、metadata kind、confidence 与 source locator
    - 直接 --knowledge-ir 输入只作为不可信语义提案；page/profile 在打开数据库前绑定已落盘 Wiki，确定性 origin、Raw 结构边、canonical/metadata/source 字段均由程序重编译
    - graph-plan-v1 必须绑定 knowledge IR 的稳定 SHA-256，并在实际 writer 调用前完成结构校验
    - semantic 输入中的每条完整 proposition 必须保持一对一 relation 身份；编译器不得按逗号、分号、句号或连接词拆成片段
    - 锁定书目作者关系只由 frontmatter/locked bibliography 确定性生成；semantic 提案中的作者谓词必须过滤，IR 内相同作者事实只保留一个 lineage
    writes:
    - temp/inbox-state/<txn>-knowledge-ir.json
    - temp/inbox-state/<txn>-graph-plan.json
    forbidden:
    - 修改 raw/wiki/graph.db
    - 让类型 prompt 绕过统一 IR 直接写图
    - 接受语义提案自报 deterministic origin、Raw structural_relations、canonical endpoint、metadata kind 或 locator
    - 丢弃 relation 的 canonical/metadata/provenance 字段，或接受空 subject/predicate/object
    - 从一条 proposition 派生多个残句 relation，或同时保留 semantic 与 deterministic 的重复作者关系
    - graph plan 与 knowledge IR hash 不一致时继续提交
    verify:
    - python3 .scripts/test_knowledge_ir.py
    - python3 .scripts/test_ingest_pipeline.py
    - python3 .scripts/engineering_graph.py validate
  graph_ingest:
    preconditions:
    - 正式提交时 wiki 页已落盘；--plan-only 可通过 --page-file 读取事务内暂存 Wiki，同时用 --page 保持最终逻辑页面 ID；类型语义输出必须先归一为经校验的 knowledge-ir-v1（历史 corrected.md 仅作兼容参考）
    - '`概念说明:` 每行以第一个 `|` 分隔概念名与局部说明；说明正文中的后续数学竖线保留为内容，三元组仍严格解析为三列'
    - graph_ingest 是所有文档类型的唯一核心 graph.db writer；调用方不得绕过 IR/plan 直接新增类型专用事实边
    - graph_ingest 所有会写 live graph 的子命令（prefill/ingest/merge/init/cleanup-*）在打开目标 graph.db 前必须经同一命令边界取得按数据库路径隔离的跨进程 writer lock；--plan-only 与正式 commit 共用该锁并串行访问 live graph，SQLite busy_timeout 只作锁外异常争用的第二层保护
    - --plan-only 必须在 live graph 上运行同一 IR、GraphDelta inspection/fusion 与结构关系校验，最后 rollback；只允许写 temp IR/plan 回执，不得持久化节点、边、alias、gloss、Hub 动力学或待办
    - clean/update 在清理前后比较本页 edge_origins，只把关系差量端点交给 Hub refresh；不得因更新既有 People page 重算全部历史邻居
    writes:
    - cross-domain/graph.db
    - Wiki 页面节点、同 stem 原件与 locator companion 合并后的 Raw 文档包节点，以及各文件路径 aliases
    - 从 Wiki sources 机械派生的 Wiki→来源→Raw 直连边
    - 语义导航边的可选 edges.source locator 与 edge_origins 页面贡献 lineage；不向 edge_evidence 复制 Wiki Raw 脚注
    - 新建 entity 的 managed_nodes 创建来源，以及页面实际使用 entity 的 node_origins lineage
    - keyword 的逐来源 node_glosses（局部 description + Raw locator），以及从已校验 gloss 初始化、无损保留的 nodes.description 主描述
    - merge 仅用于已明确确认为同一身份的节点；迁移边、alias、node origin/gloss、description review、Hub scope history 与 temporal fact，重复边合并前汇合 evidence/origin，保留目标节点既有主描述
    - Hub Scope 路由形成的论文 Wiki→研究方向边；仅 arXiv 根方向可按配置创建 Hub，旧 Hub seeds/关键词仅只读兼容
    - 内存 GraphDelta 的子图健康报告、主图 attach plan 与 query-oriented probes 随命令 JSON 返回；不新增永久子图库
    - knowledge-ir-v1 与绑定其 hash 的 graph-plan-v1 写入事务临时目录并在命令 JSON 返回摘要
    - 版本/补充材料/翻译等 Raw 结构边由 --raw-relationship-json 确定性编译进 IR/plan，并与 GraphDelta 共用外层 SQLite commit
    - 完整 proposition 节点，以及 proposition→包含→concept 的稀疏程序派生边；候选仅来自本页已确认概念和主图唯一精确 title/alias
    - bare_abbreviation 检查 keyword concept 规范名称与自由边的真实语义端点；完整 proposition 正文、结构性派生边、确定性书目端点与 canonical page path subject 不触发重复或内部标识 warning
    forbidden:
    - 常规使用 init
    - 以 rebuild_triples 写当前关系
    - 将会议关键词直接连 Hub 或让会议触发论文研究方向匹配
    - 由语义槽方向对象直接新建非 arXiv 根 Hub；未匹配既有 Hub 的方向对象必须降级为关键词
    - 标题相似度 ≤ 0.95 时判定重复（须 > 0.95 才作为候选进入 metadata 确认）
    - 将中英文一侧相同但另一侧冲突或候选不唯一的 keyword 自动归并（含 embedding 回退）
    - 跳过引文残片校验（citation_fragment 不建节点不连边）或忽略自由边裸缩写 warning
    - 合并/删 hub 后不清 graph.db 残留节点（ghost hub 由 cleanup_ghost_hubs 每次摄入兜底）
    - 在 patch_semantic_lines 中以 (主体,谓词) 单值覆盖多条同键修复（须用 deque 保序消费）
    - derived_directions 报告中以 unmatched_keywords 命名（已改为 direction_unmatched + hub_fallback_keywords + truly_orphan_keywords 三段区分）
    - 核心返回值用裸位置元组（add_knowledge_edges / assign_keyword_hubs / assign_keyword_hubs_meeting_admin 须返回 IngestResult / HubAssignResult / HubAssignMeetingResult NamedTuple，加字段不破坏调用处）
    - 将缺少文档文本支持的方向 fallback 写成“主要研究”或“涉及”事实边；fallback 只能作为导航候选进入报告/Hub 兜底
    - 让 LLM 生成 locator、作者、venue 或日期；这些字段必须从 Raw/wiki frontmatter/source metadata 确定性派生
    - 将 Wiki section source 当最终事实证据；事实核验必须继续沿该节脚注下钻 Raw locator
    - 因知识边缺少 locator 或 edge_evidence 而拒绝写入；二者都不是强制完整性字段
    - 让未通过 knowledge-ir-v1 校验的关系进入 GraphDelta，或让 graph-plan-v1 的 IR hash 与实际输入不一致
    - 为 Graph 预检复制一套简化编译/校验逻辑，或让 --plan-only 提交 live graph 变更
    - 让任一 graph_ingest 写子命令绕过数据库路径级 writer lock，或并发运行多个 live graph preflight/commit，或把多个独立论文绑定成一个全有全无的 SQLite 事务；可并发生成各自暂存 IR/子图，进入 live graph 的 inspection/fusion 必须由单 writer 逐篇原子执行
    - merge 源/目标缺失或相同仍继续写入，或删除重复边前不迁移 edge_evidence/edge_origins，或删除源节点时级联丢失节点说明复核与 Hub Scope 历史、遗留未改写的 temporal_facts
    - --page-file 改变 IR/GraphDelta 中的最终逻辑页面 ID；暂存路径只用于读取 Wiki 内容
    - 在直接 IR 的 page/profile/端点校验前打开 graph.db，或让 Raw 结构边失败后保留本次 GraphDelta/clean 的部分提交
    - 以密度、平均度、全连通、聚类系数或 locator 覆盖率作为子图/主图质量门
    - embedding 分数单独触发节点合并；只有唯一候选同时通过 label/semantic identity gate 才可复用；无精确名称碰撞的 semantic ambiguous mention 必须保留本地 keyword、原始边与 gloss，精确多候选碰撞才列为 abstained
    - 漏把第一作者标为 person，或节点 identity 复用后不补确定性 person/proposition subtype
    - GraphDelta 已锁定 person/venue/institution metadata kind 后，新建或复用节点仍保留空/keyword subtype 并进入普通 Hub membership
    - 已校验语义中由负责人等人物谓词确定为 person 的对象仍按通用 keyword 创建，导致人物维护无法识别
    - 把 Raw/LLM surface mention 因字符串恰等于既有 nodes.path 而直接当作 canonical ID；只有程序显式标记的 canonical endpoint 可无条件按 path 复用
    - 将同名异义的 ambiguous mention 偷偷复用或创建同名碰撞节点；精确名称多候选时必须软 abstain 并跳过该边，但仅 semantic gate 未过且 mention 自身无精确碰撞时不得丢弃本地节点、知识边或来源 gloss
    - 让后一次摄入直接覆盖已有非空 nodes.description；主描述是可重建导航缓存，局部来源表述必须保留在 node_glosses 并绑定 Raw locator
    - 将纯英文长标题按年份/卷号截成停用词 alias 或 keyword ID，或让停用词 alias 参与身份解析
    - 绕过 GraphDelta 硬结构检查直接融合语义边，或因软 query probe 未满分阻断摄入
    - 为保证连通性把命题内部概念自动提升为论文级研究关键词；仅报告 navigation_connectivity_candidates
    - 从 proposition 片段创建新 concept 节点，或因精确名/alias 未命中、命中歧义而告警；这些情况必须静默跳过
    - 将 edge_origins 当事实证据，或 re-ingest 时无视共享边的其他 origin 直接删除
    - 将 node_origins 当事实证据，或自动删除未标 managed、仍有其他 origin、事实关系边或时态事实的节点；仅剩可重建 `聚类于` membership 的 managed orphan 应先删 membership 再回收
    - 用 INSERT OR REPLACE 更新 nodes，触发外键级联并清除节点 lineage；节点更新必须使用 ON CONFLICT DO UPDATE
    - 将结构性包含/相似边标成可追溯事实（程序派生边必须为推断）
    - 对 frontmatter 确定性生成的发表于 venue（ICLR/NeurIPS 等规范简称）产生 bare_abbreviation warning
    - 对 proposition 正文中的 ALCE/NLI 等缩写产生 keyword-format warning，或要求改写有证据支持的完整命题
    - 将研究方向连到非 hub、同名多 hub 的歧义节点或 title/H1 不自洽的 hub
    - 新摄入继续写 Hub seeds、Hub 关键词段、未归类关键词队列或由关键词 embedding 决定论文方向；这些只允许旧数据只读兼容
    verify:
    - python3 .scripts/engineering_graph.py impact graph_ingest --verify
    - python3 .scripts/test_ingest_pipeline.py
    - python3 .scripts/test_knowledge_ir.py
    - python3 .scripts/test_graph_ingest_temporal.py
    - python3 .scripts/test_graph_delta.py
  graph_delta:
    preconditions:
    - Wiki page、Raw 文档包候选与受限 triples 已由摄入管线提供；GraphDelta 仅是内存事务对象
    - 作者、venue 等锁定 frontmatter 元数据端点由调用方标记为 deterministic metadata；精确名称未命中时按谓词专用规范名创建本地实体，不经 embedding 相似候选 abstain
    - 核心创新点、局限性、未来展望的 object 保持 proposition 身份；只复用既有 proposition 精确候选，无命题候选时创建完整本地命题，不进入 keyword 名称分解或 embedding identity resolution
    - inspect/fuse 报告携带 graph-delta-v1 validation receipt，内容寻址绑定规范化 Delta 与 attach plan；receipt 证明局部校验和 SAVEPOINT 释放，不冒充外层 SQLite commit 或事实证据
    writes: []
    forbidden:
    - 新建永久子图数据库、证据数据库或 claim card
    - 调用 LLM 判断节点身份，或把单一 embedding 分数当作 merge 依据
    - 完整双语名未先尝试“分解名称精确命中唯一 title/alias”便新建节点，或中文/英文完整名称组件命中多个 node_id 时自动复用；缩写只可在完整名称均未命中时兜底
    - 用传统图密度/全连通指标阻断融合
    - 多候选名称自动 merge
    - 将未标记的 surface mention 当作 canonical node_id；exact path 也必须与同名 title/alias 候选一起消歧
    - 将锁定的 发表于 venue 当作普通语义 mention，因近似会议名候选而跳过必需书目边
    - 将 proposition 句内 DMRG、MPS 等概念别名当作整条命题 identity 并折叠为 keyword
    verify:
    - python3 .scripts/test_graph_delta.py
  node_semantics:
    preconditions:
    - graph.db 已初始化；nodes.path 是稳定 node_id；description 可空；aliases 是确定性名称入口
    - 两个完整规范名称仅相差末尾括号缩写时可确定性视为同一名称；移除缩写后的完整名称必须相等，不能把复合标题中的局部缩写或片段提升为身份
    writes:
    - cross-domain/embeddings.db 文本向量缓存（不修改 graph.db）
    forbidden:
    - 直接创建、合并、删除节点或写 alias/边
    - 将完整双语名的中文/英文完整名称分别命中不同节点时仍判为同一身份；缩写不得推翻唯一完整名称，只可在完整名称均未命中时兜底
    - 仅因“变换/方法/材料/模型/系统/理论/算法/困难/完全/困难问题/完全问题”等泛化片段，或嵌在描述性中文长短语中的前置英文专名/eponym（单词或多词，如 von Neumann）唯一命中就复用节点；前置专名未在后半段作为完整英文译名重复时，其专名与中文余项均不得代表整串身份；双语复合名应先机械生成“去末尾英文译名或括号译名”的完整形态，只有非泛化完整形态命中才复用；复杂性类缩写锚定的“QMA困难问题”可机械归一到“QMA难问题”，裸限定词不得据此复用，否则保持 local/ambiguous，不依赖 embedding/cache 时序裁决这种轻量变体
    - 仅因输入双语名的一个分解片段命中由更长复合标题机械生成的 alias 就复用该复合节点；片段必须命中完整 title，或命中不嵌在该 title 内的独立 alias，否则继续走严格 lexical+semantic identity gate
    - 向 LLM 暴露裸向量并让其自行选择阈值
    - 将 semantic_search 相关候选升级为同一节点
    - embedding 不可用时阻断 ingest/query；必须降级到 path/title/alias 或 lexical search
    verify:
    - python3 .scripts/test_node_semantics.py
    - python3 .scripts/test_graph_delta.py
  hub_semantics:
    preconditions:
    - Hub canonical 语义来自 Hub 页唯一的
    - Hub Scope 由主 Agent 基于代表性成员的 title+description/profile、必要的图结构信号及父/待合并 Hub Scope 综合定义；不得拼接全体成员文本，也不得由 API LLM 生成 canonical Scope
    - 路由候选榜可包含 legacy Hub 供诊断，但最终 route decision 只在 canonical Hub 中取最高分；legacy top-1 不得阻断达标 canonical Hub；canonical top-1 必须同时通过 floor 与 margin，近邻 tie 只返回候选、不写 Hub 边
    - 子 Hub 即使通过 embedding floor/margin，也必须在论文 profile 中命中扣除父 Scope 后的子方向特异性词项；否则返回 child_specificity_unsupported，交 Agent 在当前候选内复核
    - keyword 使用 title+description，proposition 使用 canonical statement，People page 只在存在可定位
    - 默认 Hub 页面根为仓库根；隔离实验只能由受控 caller 显式配置 page root，并同时提供隔离 graph 与 embedding cache
    - membership 规划先跨目标 profile 汇总并去重 profile、Scope 与同类成员 prototype 文本，再单次进入 embedding cache；底层可按 provider batch 上限分块，禁止逐 profile 发起 API 请求
    - academic Hub membership 只接受 academic/wiki 下的普通节点；非 academic 摄入页必须在候选生成前直接跳过
    - refresh_after_ingest 优先接受 graph_ingest 提供的本页 origin 关系差量端点；更新已有页面不得退化为扫描并重算全部历史邻居
    writes:
    - 程序可幂等更新 graph.db 的派生 `聚类于` membership 边及 score；不修改普通节点或事实边
    - auto-create --check 仅对调用方传入的 affected nodes 规划 membership 与 lifecycle candidates，保持连接只读；membership 写入只允许显式 apply 路径
    - 已有子 Hub 的超限父 Hub 必须进入 redistribution_candidates 交给主 Agent，不得因无需新建/分裂而返回 no_action
    - canonical Hub 路由因 margin 不足时写独立 route-review handoff；redistribution handoff 必须逐个标明子 Hub canonical Scope readiness 与 blockers，未就绪时不得自动重分配
    - route-apply 只接受 route 当前 canonical candidates 中的 active research-direction Hub，必须显式 agent-confirmed；替换该论文既有 `主要研究` 路由边，并以 `研究方向定位` locator 记录 evidence、普通 origin 与 agent-confirmed origin；传入 transaction-id 时同步写 route_corrections、当前路由快照与派生 quality_status，并消费对应 route-review handoff、同步 maintenance 回执与摄入报告；无其他待审动作时 maintenance 转为 completed
    - define-scope 只为既有 active Hub 写经 validate_scope 验证的 canonical Scope，可同步 Agent 确认的 title；legacy Hub 无 membership 时必须用 --evidence-node 显式传入 legacy-scope-plan 的代表节点；只更新 Hub Wiki frontmatter/Scope 与对应 nodes title/description/status
    - redistribute 只接受 canonical 父 Hub，且所有直接子 Hub 均为 active canonical；在单次 Agent 确认下做有界单调迭代，只重算当前 `普通节点 → 聚类于 → 父 Hub` 成员在父/直接子 family 内的 membership，保留无关 Hub membership；embedding 不可用时整次回滚，无子 Hub 达标的成员保留父 Hub
    - 仅显式 agent-confirmed lifecycle apply 写 Hub Wiki、nodes.description、parent/retired/alias 结构
    - create、define、split、merge 与批量 create 的 Hub Wiki 文件必须原子替换，并与 SQLite SAVEPOINT 组成可补偿提交边界；任一步异常时恢复修改前文件并回滚本次图变更
    - lifecycle apply 返回 hub-lifecycle-v1 receipt，内容寻址绑定 operation、参数、目标 Hub 与前后文件 hash；agent-confirmed 仍是显式授权门，receipt 只提供防错与审计绑定，不冒充不可伪造身份
    - 每次 create、define、split 或 merge 写 Scope 时，必须在 hub_scope_history 记录 previous/new Scope、相关 Hub 与代表性 evidence nodes；该记录是导航定义的生命周期来源，不充当事实证据
    - split-apply 将 plan 中成员从父 Hub 的直接 membership 迁到对应子 Hub；merge 将 retired Hub 的直接 membership 迁到 survivor，同时保留 family 外重叠 membership
    - 显式配置 page root 时，Hub Wiki 只写该 root 下的镜像路径；不得回落生产 Wiki
    - 摄入末期自动触发：候选簇 cohesion≥0.6 且 members≥4 时，触发 agent（强模型）生成 title/Scope/parent，validate_scope 通过后 create_hub(agent_confirmed=True) 落盘并 apply membership；不达标候选静默进 backlog，不报用户
    - 血亲机制：membership 子Hub偏好（父Hub/子Hub同时命中时子Hub加分）；所有层级 Hub 均在成员数>30 时触发层次化分裂（先重分配到已有子Hub，仍超限则 analyze_split）；分裂子Hub centroid cosine≥0.85 视为无效分裂；merge 候选排除三代血亲（子方向边追溯，不含姻亲）
    forbidden:
    - 以 seeds、Hub 关键词列表、单一类型质心、节点数量或单一 embedding 分数定义、创建、分裂或合并 Hub
    - 让 API LLM 决定 membership、聚类、merge/split 结构或直接激活 canonical Scope；hub 定义由 agent（强模型）处理，不经 API LLM
    - route-apply 接受候选榜之外、legacy、retired 或非 research-direction Hub；define-scope 创建新 Hub 或修改普通节点/事实边；redistribute 删除 family 之外的重叠 membership 或在 embedding 降级时写图
    - 普通新增成员时自动重写 Hub Scope
    - 让无 People page 的轻量 person entity 直接参与 Hub，或用姓名 embedding 代表人物语义
    - 因节点未归类、归类歧义、旧 Hub 尚无 Scope或出现动力学候选而产生摄入 ERROR/WARN
    - hub 自动创建候选向用户报告；达标候选由 agent 自动处理，不达标候选静默进 backlog
    - 将实验 Hub 页面或 embedding 写入生产 academic/wiki 或 cross-domain/embeddings.db
    - 将 admin、teaching 或 business 节点与 academic Hub 做相似度比较或写入 membership
    - 恢复姻亲边；retired Hub 不参与 merge 候选，间接血缘传递链已断，子方向三代追溯足够
    verify:
    - python3 .scripts/test_hub_semantics.py
    - python3 .scripts/test_ingest_paper.py
    - python3 .scripts/test_ingest_pipeline.py
  sync_keyword_aliases:
    preconditions:
    - graph.db 已初始化且有 entity 节点
    writes:
    - cross-domain/graph.db aliases 表（幂等 INSERT，跳过已存在）
    forbidden:
    - 合并不同概念的同缩写节点（须缩写+去标点名双匹配）
    - 删除节点（只写 alias，不 merge/delete）
    verify:
    - python3 .scripts/sync_keyword_aliases.py（dry-run 预览碎片组数）
    - python3 .scripts/sync_keyword_aliases.py --apply（写入 aliases 表）
  ingest_check:
    preconditions:
    - 页面已写入；页面 sources 可解析时允许只读相邻 source.yaml 进行确定性书目一致性检查；使用 --graph 前已完成图写入
    - 'date 通常为有效 YYYY/YYYY-MM/YYYY-MM-DD；来源确实无可证日期时允许显式 date: null + date_status: unknown，created/updated 仍须为完整日期'
    - paper-summary 作者覆盖优先以 source.yaml 中 review.locked=true 的 bibliographic.authors 为 raw 锚点；仅在锁定作者不可用时回退 paper.md 机械提取，或在人数/顺序逐项一致且唯一差异是锁定姓名停在 De/van/von 等姓氏连接词时，采用 paper.md 中的完整向后扩展
    - paper-summary 标题覆盖优先以 source.yaml 中 review.locked=true 的 bibliographic.title 为 raw 锚点；锁定标题不可用时才回退 paper.md 首个 H1，避免出版社包装标题造成假 WARN
    - Wiki 正文不得含残留 RAW#Lx handle 或形如 [^r13]6> 的残缺 RAW 脚注；这些是确定性编译失败并作为 ERROR 阻断 finalize
    writes: []
    forbidden:
    - 将 WARN 静默留给未来 Lint
    - 对 paper-summary 忽略 source.yaml 中 published year/DOI venue 与 wiki frontmatter 的确定性冲突
    - 已有锁定 bibliographic.authors 时仍用 paper.md affiliation 碎片推高 raw 作者数并产生假 WARN
    - 已有锁定 bibliographic.title 时仍用 paper.md 出版社包装 H1 产生标题覆盖假 WARN
    - 在人数、顺序或非姓氏连接词作者项不一致时，用 paper.md 覆盖 locked authors
    - 使用 --graph 时忽略作者集合、venue、占位符元数据、方向 Hub 唯一性、Raw 文档包节点或 Wiki→来源→Raw 直连缺失
    - 因本页知识边未填写 locator 或 edge_evidence 而报错/告警；只检查已填写 locator 的可解析性
    - 将可识别的短脚注前缀当成完整引用，从而忽略其后的数字与 > 残片
    verify:
    - python3 .scripts/test_ingest_check.py
  ingest_build:
    preconditions:
    - 页面和图局部校验已通过；已按 INGEST 确认派生范围
    writes:
    - 目录、索引或状态等派生物
    forbidden:
    - 猜测参数后对全库重建
    verify:
    - 从 operations/INGEST.md 复制本轮指定收尾命令
  extractor:
    preconditions:
    - PDF 已归档为 raw 实体副本
    writes:
    - 同目录 paper.md 及提取派生物
    forbidden:
    - 改写或删除来源 PDF 作为常规路径
    - 另写 PyMuPDF 兜底
    verify:
    - python3 .scripts/test_extractor.py
    - 检查 paper.md 并继续骨架/摄入流程
  query_actions:
    preconditions:
    - hybrid_recall 的 intent 必须是 fact/relation/explanation/exploration/lineage；结果只是候选，不形成 identity 或事实断言
    - wiki_context 必须指定可解析的 page#section，Graph envelope 有 top-k 与 traversal profile 边界
    writes: []
    forbidden:
    - 把 section capsule、embedding 分数或 Graph neighbor 直接当作事实证据
    - 把动态 Graph context 回写为 Wiki related 或静态正文
    verify:
    - python3 .scripts/test_query_orchestrate.py
    - python3 .scripts/test_wg.py
  query_graph:
    preconditions:
    - 已确定查询目标；事实性结论另行从相邻 Wiki section 的 Raw 脚注回到 Raw，边 locator 仅作可选捷径
    - node 详情可返回主 description 与 node_glosses 的 Raw locator，二者用于身份导航和证据下钻，不直接充当事实答案
    - predicate family 从 operations/config/graph-schema.yaml 与端点类型派生，不写回 edges；profile 只限制遍历平面
    writes: []
    forbidden:
    - 把图边、Hub 或 Navigation 直接当事实答案
    - 将不同召回器的原始分数直接相加；联合召回使用按 intent 加权的 reciprocal-rank fusion
    - 绕过 query_orchestrate 的预算和动作约束执行广泛检索
    verify:
    - python3 .scripts/test_prompt_audit.py
    - python3 .scripts/test_query_graph_temporal.py
  ingest_pipeline:
    preconditions:
    - 所有来源清理延后到 validate_completion 通过且 completed 状态持久化之后；清理失败保留 cleanup_pending 并可通过 completed resume 只重试清理，不重写 Wiki/图或重复收尾
    - preprocess 允许返回 prepared 的 agent-task-v1；恢复后回到 preprocess 校验源绑定 OCR，再进入 write_wiki，不能把等待图片转写误判为 failed
    - 初次生成不计为 recovery；wiki_revision、semantic_revision、deterministic_repair 与 subagent 分别消费 RecoveryPolicy 预算
    - LLM infrastructure/output_transport 恢复只由 llm_structured client 处理；pipeline 收到失败结果后不得原样再次调用 provider step
    - validator、commit 前复验、resume 复验、graph 写后校验和 LINT 是独立正确性闸门，不计入 recovery budget
    - commit/resume 复验必须允许领域 spec 接收同轮非阻断 warning 并持久化质量状态，不得只判断阻断项后丢弃 warning
    - spec.unified_semantic_worker=true 时，Wiki 或 semantic 硬错误必须清空同轮成对产物并回到同一 write_wiki provider，重新通过两套 validator；其他 pipeline 不改变既有恢复点
    writes:
    - 事务状态、staged artifact 与既有 finalize/graph 提交边界；不直接估算 API 调用数
    forbidden:
    - 用 wiki_retry+slots_retry 或单个 max_retries 控制不同失败类别
    - 把非阻断 warning 计入 deterministic repair，或用清空 content/error 绕过已耗尽预算
    - 因 API transport failure 在 pipeline 或 DSH 层重跑整个 write step
    verify:
    - python3 .scripts/test_ingest_pipeline.py
    - python3 .scripts/test_ingest_document.py
    - python3 .scripts/test_ingest_admin.py
  ingest_common:
    preconditions:
    - 共享摄入器只接收事务内 staged Wiki/semantic、结构化 validator issues 与受限候选目录
    - Agent backend 生成 agent-task-v1 并等待当前宿主提交；API backend 才调用 semantic patch Worker
    writes:
    - 当前摄入事务的 staged semantic 产物与 temp 语义修补缓存
    forbidden:
    - 在 Agent backend 调用外部模型，或让 API Worker 持有事务控制循环
    - 接受候选目录外 issue ID、整页改写、无证据元数据或绕过 validator 的局部补丁
    verify:
    - python3 .scripts/test_ingest_pipeline.py
    - python3 .scripts/test_ingest_document.py
    - python3 .scripts/test_ingest_meeting.py
    - python3 .scripts/test_ingest_paper.py
    - python3 .scripts/test_prompt_audit.py
  inbox_state:
    preconditions:
    - status 必须属于已登记摄入状态；failed/agent_required 等非线性恢复只允许通过受限 transition helper 回到明确恢复点
    - superseded 只用于关闭同源重复事务；旧事务必须仍未提交，新事务必须 completed/duplicate_found，且 source 与已有 source_hash 均一致，关闭动作仍经 transition 与原子 save 留审计轨迹
    - failure taxonomy 保留 API、事务与 DSH 的层级差异，但事务统一产出 category/domain/disposition/retryable/owner/next_action，外层适配器优先消费结构化结果
    - JSON/协议 section 解析失败属于 worker_output_invalid；具备同协议 host-agent handoff 的编排器必须保留原事务并进入 agent_required，不得降级为 unknown_failure
    - failure taxonomy 只解释 failed/validation_error 等终态或非空 errors；write_wiki 等活动阶段在无错误时不得生成 failure
    writes:
    - temp/inbox-state/<transaction-id>.json，使用同目录临时文件、fsync 与 os.replace 原子替换
    - 只读 summary 仅聚合事务 telemetry 与 canonical LLM ExecutionEvent，不改摄入状态或事实层
    forbidden:
    - 直接覆盖事务 JSON 导致中断时留下半个文件
    - 删除 stale prepared 状态文件、跨来源 supersede，或用未完成事务取代旧事务
    - 接受未知 status，或让持久化 resume_from/pre_handoff_status 跳到未授权阶段
    - 用事务 stage 计数或 DSH session log 推算真实 API 请求数
    verify:
    - python3 .scripts/test_ingest_pipeline.py
    - python3 dsh/test_dsh_ingest_tools.py
  llm_structured:
    preconditions:
    - 当前 QUERY_BACKEND 或 INGEST_BACKEND 必须为 api；agent backend 调用应立即拒绝并改用 agent-task-v1
    - 调用方已提供 Schema 约束、模型配置和可审计输入
    - 推理档位仅在 fast/standard/deep/xdeep 枚举内；provider reasoning 参数仅在显式配置时透传
    - 摄入自适应策略按 operation 选择初始档；只有确定性校验标记为 semantic 的重试才升一级，structural 重试不升档
    - 推理档位与调用方 max_tokens/recovery_limits 完全解耦；长输出不得因低推理档位被截断
    - 长文本调用用 call_text（镜像 call_json 的 API transport/recovery，但跳过 JSON 解析）
    - call_text 传 messages 时必须原样使用完整会话历史；受限重试只追加一条纠错 user 消息，不得退回 system+prompt 单轮请求
    - 摄入调用必须把 transaction_id 写入 ExecutionEvent；每次真实 HTTP 请求立即写一条 llm_api_call，并以 call_id 关联同一逻辑调用的恢复尝试
    - messages 模式的 input hash/length 覆盖完整序列化会话而非标签 prompt；事件只存 hash+length，不保存正文
    - client 只消费 infrastructure 与 output_transport 预算；每类独立耗尽，配置/权限错误不重试
    - ingest_proposition 仅作兼容 operation 保留 call_json Schema + fast 档；默认论文 3.6c 不再调用
    - ingest_bibliographic_review 使用 call_json Schema + fast 档，仅做候选裁决与版本含义识别；不得绕过调用方的候选边界
    - ingest_paper_workspace 使用 call_text + standard 档，一次传输 evidence-bound bibliography、Wiki 与 semantic slots；沿用 INGEST_GENERATION specialist profile，调用方仍须分别解析和校验三段产物
    - ingest_relation_review 与 ingest_semantic_fill 使用 call_json Schema + fast 档；前者只选 relation candidate ID，后者只按 issue ID 返回局部 patch，均不得自由改写程序定位或提交状态
    - ingest_semantic_recovery 使用 standard 档和可选 SEMANTIC_RECOVERY_* specialist profile；三项配置不完整时回退主模型，不得因目录推荐值缺失或模型上下线阻断摄入
    - 空输出且 finish_reason=length 时下一尝试必须切到已配置的 fast/low effort 并扩大输出预算；不得以省略字段冒充禁用默认思考
    writes:
    - 仅输出调用方指定的结构化响应或草稿文件
    - temp/llm-events/YYYY-MM-DD.jsonl（canonical ExecutionEvent；每次真实 API 请求一条，API configuration 为非调用事件）
    forbidden:
    - 接受 agent backend、生成 agent handoff，或把当前宿主 Agent 包装成模型调用结果
    - 绕过调用方的证据边界直接写 raw/wiki/graph.db
    - 在配置缺失时静默降级模型或格式
    - 用推理档位改写调用方的 max_tokens 或重试预算
    - 只在 wrapper 返回时写汇总事件、用 stage counter 推算调用数，或把 configuration 事件计为 API 请求
    - 在 infrastructure/output_transport 预算耗尽后由 pipeline 或 DSH 原样重试
    - 假定所有 OpenAI-compatible 服务端支持同一 reasoning 字段
    - 在已经没有后续尝试时仍返回“下轮扩容/下轮降低推理强度”的误导性错误
    verify:
    - python3 .scripts/test_api_ingest.py
    - python3 .scripts/test_prompt_audit.py
    - python3 .scripts/test_ingest_paper.py
    - python3 .scripts/test_llm_events.py
    - python3 .scripts/test_query_api_loop.py
  recovery_policy:
    preconditions:
    - 所有预算均使用版本化 recovery class；attempt 表示首轮之后允许的恢复次数，不混用实际 API 调用数
    - 旧事务的 wiki_retry/slots_retry 只迁移为对应 typed stage attempt，不反推 LLM API 调用次数
    - infrastructure、output_transport、wiki_revision、semantic_revision、deterministic_repair、subagent 分别计数并独立耗尽
    writes:
    - 事务 state.recovery（policy_version/limits/attempts/last_action，仅用于流程恢复与审计）
    forbidden:
    - 用 wiki_retry + slots_retry 估算真实模型调用次数
    - 同一 recovery class 超预算后原样重试，或以清空错误计数绕过预算
    - 把 validator、commit 前复验、resume 复验或 LINT 合并进 recovery budget
    verify:
    - python3 .scripts/test_recovery_policy.py
    - python3 .scripts/test_ingest_pipeline.py
    - python3 .scripts/test_llm_events.py
  agent_task:
    preconditions:
    - 仅用于当前宿主 Agent 可直接执行的工作；任务只声明已定位输入、待写暂存产物、版本化协议、当前 issues 与确定性后续命令
    - INGEST_BACKEND、QUERY_BACKEND 与 RESEARCH_BACKEND 由无模型依赖的共享选择器读取，进程环境优先于仓库 .env，缺省为 agent
    - manifest 是数据契约而非二次提示词；语义判断由当前 Agent 基于来源与项目规范完成，程序不模拟、约束或评价 Agent 的推理过程
    - 输入和输出必须是仓库内相对路径；输出只能位于受管暂存区，提交仍由原摄入器或专用事务工具负责
    writes:
    - 仅修改调用方的内存/事务 state.agent_task；不直接写 raw/wiki/graph.db 或调用模型
    forbidden:
    - 导入 dsh 或 llm_structured，构造角色提示词，调用模型，或把 Agent 正常工作记为 agent_required/API failure
    - 让 Agent 自证产物正确，绕过原有 parser/schema/validator/graph preflight/commit/rollback
    - 在 manifest 中复制工程文档全文或把内部状态枚举当作 Agent 操作流程
    verify:
    - python3 .scripts/test_agent_task.py
    - python3 .scripts/test_ingest_pipeline.py
    - python3 .scripts/engineering_graph.py validate
  meeting_compiler_contract:
    preconditions:
    - API adapter 与当前 Agent 产物共同使用 meeting-compiler-v1 delimiter、context hash、parser、preprocess schema 与非级联 replacement 规则
    writes: []
    forbidden:
    - 导入 dsh 或 llm_structured、调用模型、写暂存/最终文件，或因 backend 改变协议解析与机械校验
    - 接受空 Wiki/slots、重叠/重复 replacement 或原文中不存在的 replacement source
    verify:
    - python3 .scripts/test_agent_task.py
    - python3 dsh/test_meeting_compiler_agent.py
    - python3 .scripts/test_ingest_meeting.py
    - python3 .scripts/engineering_graph.py validate
  ingest_paper:
    preconditions:
    - inbox 学术 PDF；paper.md 生成后，Agent/API 共用 paper-agent-workspace-v1 语义产物协议，一次产出书目裁决、Wiki 与语义槽；Agent 直接填写 workspace，API adapter 只发一次有界模型调用，程序仍分别物化、校验与提交
    - 3.1 在读取 PDF 标题前先查询源文件 SHA-256；精确命中直接 duplicate_found，不调用 MinerU/LLM；MinerU 与书目锁定后再以 normalized text/title+authors+year/DOI/arXiv 做二次去重屏障
    - agent workspace 返回明确 write_to；程序按 bibliography → wiki → semantics 顺序物化为独立暂存产物并逐层校验，resume 不重跑 MinerU 或已通过阶段
    - Agent 只经 paper_workspace_read/refresh/check/commit 四个类型化动作接管事务；公开 workflow_status 仅允许 awaiting_agent、ready_to_commit、completed、failed，内部细粒度 status 只作为 internal_status 返回
    - 确定性 PDF metadata、首页规则与 MinerU 解析器只注册为带 provenance 的 candidate provider；候选是否锁定仍由 candidate-id-v2 裁决与 validator 决定
    - bibliographic-candidate-provider-v5 从近端 ACM Reference format 引用提取标题与 venue 候选并绑定该引用的精确 paper.md locator；venue 边界覆盖 ACM、Proc. ACM、J. ACM 与 Proceedings 形态，首个 H2 仅保留为备选标题候选；作者行在已识别姓名后遇到全大写机构缩写即截断，并删除可由干净姓名覆盖的“姓名 + 机构”重复候选，原始 paper.md 证据不改写
    - awaiting_output workspace 的 candidate provider 版本落后时，--resume 仅在 paper.md 哈希未变且 workspace 输出尚不存在时刷新同一事务；已有未提交输出必须经显式 --agent-refresh 归档旧输出及哈希后刷新，不得静默覆盖或新建事务
    - paper_workspace_check 在书目可物化后尽量同轮收集 Wiki 与 semantics 的全部独立 diagnostics；只有依赖项不可用时才跳过下游门，并明确 skipped_by
    - Agent check 在最终 Raw/Wiki 落位前调用 graph_ingest --plan-only，以暂存 Wiki、暂存 Raw locator companion 和最终逻辑 page ID 在 live graph 上生成并校验 graph-plan-v1
    - Agent workspace 把暂存 paper.pdf 的 pages:1-2 作为首个有界书目输入，并提供程序抽取、带页码的 first-two-pages.txt 作为读取工具不支持 PDF 时的备用；两者均绑定哈希，Agent 核对完整作者/标题/venue 后仍引用候选 ID 或受 validator 约束的 paper.md locator，最终书目锁定仍归共享内核
    - workspace prompt、bibliography/semantic contract、各 validator 与 validation receipt 均写入显式版本；receipt 绑定 paper.md/workspace/wiki/semantic/IR/graph plan 哈希
    - agent workspace 记录 paper.md input hash 与 workspace output hash；落位前重新核对，任一暂存输入在校验后改变都必须停止提交并回到原 workspace 修正
    - paper.md 生成后、persist_bibliographic_metadata 前执行 ingest_bibliographic_review 轻量预审；输入仅 PDF metadata、标题邻域与发表证据行
    - 书目预审优先裁决 PDF metadata 与 paper.md 机械提取的程序候选；仅 authors 可在候选不完整时由 Worker 提交逐人 proposed value + paper.md 行 locator，其他字段仍只能选择候选 ID
    - 书目 Worker 使用 candidate-id-v2 协议，一次返回整篇 title/authors/year/venue/DOI/arXiv 的候选 ID 选择与可选 authors.proposed；程序根据 catalog 编译候选，并逐项验证 proposed 是 locator 窗口中的原文姓名、非 affiliation、非 et al 或多人合并值
    - authors.proposed 只能引用 Worker 已收到的标题邻域 paper.md#Lx[-Ly]，每项最多四行且必须逐字可核；proposed 非空时必须给出完整有序作者列表且 accepted_ids 为空，列表不得重复；Worker 不得为 title/year/venue/DOI/arXiv 自由生成值或 locator
    - 标题作者块若把机构词或全大写机构缩写粘到末位作者，作者完整性复核只允许忽略已验证姓名后的明确机构尾部；真实缺失的作者仍须阻断
    - 本篇 DOI/arXiv 候选只来自 PDF metadata、首页或标题邻域；References/正文引用中的标识不得进入 self-bibliography 候选
    - 候选为空的可选书目字段由程序直接派生为空值；Worker 返回中的空 candidate_id 状态只作冗余信息，不得造成可机械避免的中断
    - deterministic_fast_path 不以单候选或 DOI/arXiv 单独放行；只在 title/authors/year/venue/identifier 的独立 candidate provider 近端证据一致、作者完整有序、标题无刊头形态且标识不来自引用区时锁定书目，否则进入共用语义 workspace
    - Worker 输入按协议版本+candidates+有限证据计算 input_hash；事务内只缓存当前协议 schema-valid decision，resume 或同输入重入必须 cache_hit，不重复调用
    - 标题高度相似但无 DOI/arXiv 强标识时不得直接标 duplicate_found；先完成 MinerU 后的 normalized-text+locked-bibliography 去重，再仅对仍未决候选调用一次 relation-id-v1 Worker
    - relation-id-v1 只能选择程序提供的 relation candidate ID 与 version/unrelated/ambiguous；精确 duplicate、supplementary、translation 仍由哈希/标识/文件名规则确定，Worker 不得删除 Raw 或直接建边
    - duplicate_line 等可机械修复的阻断 warning 先由程序处理且 API 调用为零；仍有非机械阻断项时整批最多一次 semantic-patch-v1 Worker，按 issue ID 局部 patch 后全量复验
    - relation/semantic Worker 均使用 retries=0、事务 input_hash 缓存；相同输入 resume 不得重复调用，worker receipt 记录控制决策，真实调用数只从 canonical ExecutionEvent 聚合
    - 书目 fields 必须有精确定位 evidence；Worker 无法裁决时对应 status=ambiguous 且 review_status=manual_required，事务转 agent_required 并提供同一 v2 schema/write_to；Agent 仍受相同证据与程序硬约束，禁止继续落位
    - 预审锁定 state.bibliographic_meta 后，paper-id、skeleton、wiki frontmatter 与 graph 机械作者边只消费该结果，不再从 paper.md 二次解析
    - 新论文 wiki prompt 不生成 <<<META>>>；date/type/title/authors/venue/path 均由程序与 locked bibliography 确定性编译
    - 旧事务若仍携带 <<<META>>>，只写 legacy_meta_audit；不得据此改 paper-id、Raw/Wiki 路径或 locked bibliography
    - API adapter 将有界 paper context、候选目录、页面骨架与语义契约编入一次 paper-agent-workspace-v1 调用；40k chars 内的短论文保留全文，超长论文才按 22k chars 预算定向选段；输出依次通过 bibliography/Wiki/semantics/Graph preflight validator，不因合并调用放宽任一门
    - 预审前读取 PDF metadata（含 subject）与第一页发表页脚；同一证据行含 received/published 时 published year 优先；有近端 year/venue/DOI 证据时必须回填 skeleton/wiki
    - metadata.subject 中完整 journal citation 或期刊名属于近端 venue 候选；仅在可识别期刊形状时提取，不把关键词/分类主题猜成 venue；可靠 venue 候选存在却未锁定或未回填 Wiki 时硬阻断
    - 首页证据中的完整 Proceedings of ... 或 Findings of ... venue 原文必须进入候选集合，即使规范化 venue 为空或省略 Proceedings/Findings 前缀
    - APS DOI 采用确定性 journal/volume/article 映射补齐 venue，不允许从摘要或参考文献猜测本篇 venue
    - 锁定书目后确定性检查标题卷期页眉污染与明显作者缺失；命中只降级 quality_status 并保留结构化 warning，不回滚已提交事实
    - bare_abbreviation/descriptive_phrase 等非阻断语义 warning 在正常校验、提交前复验与 resume 复验中均须写入 semantic_warnings/quality_warnings，并派生 quality_status=degraded；无 warning 时为 complete
    - GraphDelta 写入成功后的 query probes 若两跳边界未全可达或存在 ambiguous mentions，记录 graph_navigation_* warning 并降级 quality_status，不把软导航缺口升级为提交失败
    - completed 事务通过 --resume 只刷新 bibliographic_* 与 graph_navigation_*/graph_semantic_coverage_sparse 派生告警并在变化时保存，不重开摄入或改写 Raw/Wiki/Graph；结果分别报告 standalone bibliographic_worker 与合并 API workspace_worker，API 恢复耗尽的 owner 为 host_agent
    - 语义槽少于 4 条时在落位前最多定向重抽取一次；重抽取不得重写已通过校验的 Wiki，并在两次结果中保留三元组更多的一版；仍少于 4 条才以 graph_semantic_coverage_sparse 降级提交
    - SLOTS 外层与三元组 section 使用同一结构诊断；正文仅含完整裸三元组时程序确定性补入 `三元组:`，不得为可机械修复的缺 section 调用 Worker
    - 语义覆盖率只统计 `三元组:` section 中可解析的 Worker 关系，排除由 Wiki frontmatter 确定性生成的作者、期刊等边，并在 prepare/commit 间保持同一口径
    - API/agent 语义槽为三元组中的 keyword 输出 `概念说明:` 局部 description；Worker 不生成 locator，程序从 Wiki section 脚注机械绑定 Raw locator，缺 locator 的 gloss 不得写 node_glosses 或主 description
    - API 与 Agent 的 combined prompt 必须由同一版本化 bibliography/Wiki/paper semantic contract 编译；backend 只改变上下文传递方式，不得改变 candidate 边界、concept/proposition 类型、谓词边界或 Graph topology policy
    - workspace 校验失败只重开受影响产物：bibliography 失败阻断全部下游，Wiki 失败保留已验证 bibliography，slots 失败保留已验证 bibliography 与 Wiki；API 定向修复只调用对应 artifact，Agent 在原 workspace 内只改对应 segment
    - 研究基础/核心方法/对比方法的 object 是可复用 concept；核心创新点/局限性/未来展望的 object 是论文明确陈述的完整 proposition；概念间关系两端都必须是可独立指代的 concept
    - 论文级方向/标签谓词若会被 Graph 编译退役，须在共享 semantic validator 中阻断并反馈原关系；概念间关系链至少一个端点须经论文级概念谓词锚定，避免生成无论文入口的局部孤岛
    - 真正内容稀疏的重抽取须向 Worker 提供已解析数量、最低数量与上一版语义槽；混合格式或不可解析内容必须返回结构化诊断，不得伪报为零条内容
    - conflicts 可保存结构化对象或描述性字符串审计项；title/venue 的错误 evidence 只在 paper.md 前 160 行存在唯一精确命中时机械重定位，窗口最多连续 4 行且 normalization 留痕，多处命中仍硬阻断
    - 缺失或断行的 SLOTS wrapper 仅在去除包装后正文全部为完整三元组时容错，随后仍须通过完整 semantic parser/validator
    - API Worker 新生成的 SLOTS 内容若仅在末尾残留 `<<</SLOTS>>>` 的严格非空前缀，可在 API 输出消费处机械删除并记录审计标记；Agent workspace/恢复产物不经该清理
    - API 兼容 handoff 必须报告 `execution_backend=api`、明确的 `write_to` 和 API recovery plan；成功恢复后清除过期 `next_action/retryable`。Agent 后端仍使用 `prepared + agent-task-v1` 及原 workspace plan
    - paper-id 的拉丁文本保持 ASCII slug；作者或标题只有中文等非 ASCII 文本时使用稳定 Unicode slug，禁止退化为 paper-YYYY-paper
    writes:
    - temp/inbox-extract/<txn>/ paper.md/manifest.json/语义槽与 wiki 草稿
    - temp/inbox-extract/<txn>/agent-workspace.txt（paper-agent-workspace-v1 共用语义输出；Agent 直接写入或 API adapter 单次生成）及独立物化的 bibliographic-review.json/wiki.md/semantic.txt；各自产物通过对应 validator 后才可进入提交
    - temp/inbox-extract/<txn>/workspace-history/*（显式 --agent-refresh 归档的未提交旧 workspace 输出）
    - temp/inbox-state/<txn>-bibliographic-decision.json（candidate-id-v2 Worker 的事务级幂等缓存，不是事实源；extract 目录重建后仍可复用）
    - temp/inbox-state/<txn>-relationship-decision.json 与 <txn>-semantic-patch-decision.json（事务级决策缓存，不是事实源）
    - temp 语义槽中的 `概念说明:` 文档局部描述（事实仍回溯 Wiki 脚注指向的 Raw，不直接作为事实源）
    - temp 事务 source.yaml.bibliographic（随 raw 原子落位）
    - temp/inbox-state/<txn>-knowledge-ir-preflight.json、<txn>-graph-plan-preflight.json 与 paper-agent-validation-receipt-v1（仅校验回执，不是事实源）
    - 最终 raw/wiki 经 inbox_finalize 原子落位
    - cross-domain/graph.db 经 graph_ingest
    - wiki/log.md 与 wiki/index.md 与派生目录
    - raw 关系候选由论文管线检测，版本/补充材料/翻译边由 graph_ingest 编译进统一 IR/plan/commit
    - cross-domain/source-fingerprints.db（成功落位后登记 binary/text 指纹；索引可从 Raw 重建）
    forbidden:
    - agent 全程监控正常摄入（默认 quiet，仅读最终 JSON）
    - 对非 inbox 来源或非学术 PDF 使用
    - bibliographic_review_required 或 type 非 paper 时继续 persist/finalize/graph 提交
    - 绕过书目预审而让 skeleton/wiki/graph 各自从 paper.md 再次解析 authors
    - 书目预审为 authors 之外字段自由生成候选外值；authors.proposed 缺 paper.md locator、无法逐字核验、包含 affiliation/et al/多人合并值时继续落位
    - ACM 引用标题/venue 候选使用摘要或正文中的首次同词命中作为 evidence，或在 candidate provider 升级时静默覆盖已经存在的 Agent workspace 输出
    - 把候选为空字段的控制状态交给 Worker 决定，或从全文 References 的 DOI/arXiv 构造本篇标识候选
    - agent 后端为同一论文依次发出书目与 wiki/slots 两次常规主动交接，API 正常路径分别调用书目/Wiki/slots Worker，或把合并 workspace 当作绕过任一独立 validator 的许可
    - 因 slots 错误清空或重写已经通过验证的 bibliography/Wiki，或因 Wiki 错误重新裁决已经通过验证的 bibliography
    - 对 Agent 暴露内部阶段枚举作为流程控制接口，或 check 遇到首个 Wiki/semantic 错误就丢弃同轮可独立发现的其他诊断
    - 在 staged Graph preflight 通过前落位最终 Raw/Wiki，或把 preflight 产生的 live graph 临时变更提交
    - 按字段或作者逐项调用书目 Worker，或在 deterministic_fast_path/cache_hit 后仍调用 Worker
    - 相同 candidate-id-v2 input_hash 因 resume/重入重复消耗 API；typed transport recovery 耗尽后不得在 pipeline 或 DSH 原样重试
    - 对 duplicate_line 调用 LLM，或对同一批 semantic warning 先后调用 fill/repair 两个 Worker
    - 在 normalized-text 去重前让关系 Worker 把近似标题直接判为 duplicate，或让 Worker 自由生成 target path/locator
    - 二进制指纹精确命中后继续解析，或二次去重命中后仍生成 -2/-3 重复条目
    - graph validation 的相同失败签名在外部状态未变化时原样 resume；必须返回 retryable=false 与 next_action
    - 绕过 3.4/3.6/3.8 校验闭环
    - 硬错误不回 3.3 而静默继续
    - 把 warning 当失败回 3.3 全量重写（应走 3.6b 局部修复）
    - 因语义槽稀疏重复重写 Wiki、无限重试，或用覆盖更低的重抽取结果覆盖已有较高覆盖结果
    - 把 section 外已存在的三元组形状行静默计为零，或用确定性书目边填充 semantic_triple_count/semantic_coverage
    - 对只缺 `三元组:` section 的完整裸三元组发起 API 重试
    - 用 paper.md 正文首个引用年份覆盖已有 PDF metadata/第一页发表年份
    - 首页明确写有 Published as a conference paper at <venue> <year> 时只提取年份而丢失 venue
    - 因规范化 venue 截短而拒绝首页证据中可精确提取的 Proceedings of ... 或 Findings of ... 完整值
    - 让 LLM 覆盖程序已确定性填入的 date/venue
    - metadata.subject 已提供可识别期刊证据时忽略该证据，或允许空 venue 通过书目/Wiki 提交门
    - 让旧 <<<META>>> 改写 paper-id、Raw/Wiki 路径、doc_type、date 或 locked bibliography
    - 要求弱 LLM 生成 evidence JSON、source locator 或确定性书目边；语义模型只输出短三元组与一句式文档局部概念说明，locator 由程序机械派生
    - 默认调用 proposition 专用 LLM 把完整命题拆成原子三元组；3.6c 只登记稀疏程序编译状态，不增加 LLM 负担
    - 不确定的 raw 关系不交 agent 确认而静默建边
    - 从"关联/构造/表示"推断"基于"等方向边，或把研究对象、模型维度、实验设置和适用场景标为局限性
    - 从 proposition 句内碎片创建 concept 节点；完整命题始终保留，概念链接交 graph_ingest 的唯一精确 title/alias 稀疏匹配
    - 在任一 prompt backend 中恢复“叙述节点 + 两条拆分边 + 一条自由边”的旧式四边展开，或让 API/agent 使用不同 semantic policy
    - 允许本论文使用主要研究/涉及/应用于/探索/属于/研究关键词等会被 Graph 编译静默退役的方向或标签谓词
    verify:
    - python3 .scripts/test_ingest_paper.py
    - python3 .scripts/engineering_graph.py validate
  ingest_meeting:
    preconditions:
    - inbox 会议纪要仅接受 .txt 与显式 subproject=academic|admin|business；去重后先生成 entity-candidates.json，不提前 apply 最终纠错
    - Meeting Compiler 初次调用同时返回 meeting-compiler-v1 PREPROCESS/WIKI/SLOTS；API 与 agent handoff/resume 共用同一协议
    - API Meeting Compiler 返回 rejected/协议解析错误时必须保存失败 trace，并在原事务生成 prompt/write_to 后进入 agent_required；不得新建事务或把错误归类为不可恢复 unknown_failure
    - YYYYMMDD 文件名保留显式年份；仅有 MMDD 或无日期时允许用摄入年分区，但 state 与 Wiki frontmatter 必须标记 date_inferred，禁止把推断年份伪装成 raw 明示事实
    - Meeting Compiler META 的非空 title 在落位前生成最终 meeting-id 并重算 raw/wiki 路径；sources 由程序回填最终路径，重试时保持 canonical ID 稳定
    - replacement 只在原文精确命中并通过非级联应用校验后写 staged corrected.txt；Wiki 与 semantic 必须分别通过 validator
    - 所有会议语义经 knowledge-ir-v1 和绑定 hash 的 graph-plan-v1 进入 graph_ingest 唯一 writer
    writes:
    - temp/inbox-extract/<txn>/entity-candidates.json、corrected.txt、entity-resolution.json、wiki.md、agent-meeting-compiler.txt
    - temp/inbox-state/<txn>.json、knowledge-ir-v1 与 graph-plan-v1 临时产物
    - 最终 Raw/Wiki 经 inbox_finalize；cross-domain/graph.db 或 private graph 经 graph_ingest
    forbidden:
    - 修改原始会议 Raw，或把 corrected/entity-resolution/DSH session log 当事实源
    - 让 Wiki-only、slots-only 或第二个语义 Worker参与正常会议编译
    - agent handoff 后从原 .txt 新建事务，或在缺 write_to 产物时跳过 resume 校验
    - 让 rejected Meeting Compiler 输出直接进入 failed，或在协议 handoff 已可用时要求人工覆盖事务状态
    - 丢弃 YYYYMMDD 文件名中的年份，或对 MMDD 当前年推断不留 date_inferred 审计标记
    - 绕过 Wiki/semantic/IR/graph validator 或由 Meeting Compiler 直接写图
    verify:
    - python3 .scripts/test_ingest_meeting.py
    - python3 dsh/test_meeting_compiler_agent.py
    - python3 .scripts/test_ingest_pipeline.py
    - python3 dsh/test_dsh_ingest_tools.py
    - python3 .scripts/engineering_graph.py validate
  ingest_document:
    preconditions:
    - 图片 source_type=ocr，复核后仍不自动升为 high；shared 编译 Wiki 复核状态与正文限制，sidecar 保留完整复核记录；非正式普通文本不得仅凭 ordinary 推为官方高可信来源
    - 独立图片走 image_ocr shared 校验与 Markdown companion；--ocr-result 显式消费源哈希匹配的回执，缺省 Agent 模式交接当前 Agent，API 模式须 --allow-remote-ocr 才调用远程识别
    - 图片 finalize 前重新核对原图、暂存实体 SHA-256 与 companion 全文；缺失、改动或非同源时拒绝落位，不能靠 manifest 过滤缺失文件后继续
    - 图片来源 sidecar 与原图及同 stem Markdown 必须同事务提交；finalize 从已验证 OCR 回执重建预期溯源并逐项比较，来源日志指向最终 sidecar；其元数据不是独立事实证据，OCR 时间不是业务日期
    - inbox 通用文档（.docx/.doc/.pptx/.txt/.pdf）；--subproject 指定域(academic/admin/teaching/business)
    - academic 域必须显式提供 document_type=editorial|academic-reference|conference-summary；缺失或非法时返回 classification_required，且在建立事务、预处理与落位前终止
    - academic/editorial 分别写 raw/works/editorials 与 wiki/editorials；academic-reference 分别写 raw/reference-documents 与 wiki/references，不与论文 raw/references 混用；conference-summary 分别写 raw/conferences 与 wiki/conferences
    - wiki prompt 使用提取文本的 RAW#Lx 行号时，PDF 与其他无原生行定位格式必须生成同名 Markdown locator companion；原始文件仍随同落位
    - 落位前 Wiki locator 校验对原生 section-line 来源映射仍在 inbox 的原文件，对非原生来源映射事务内 Markdown companion；不得因最终 Raw 尚未落位而误报路径不存在
    - API LLM 只负责 title/type/status、语义正文与直接 RAW handle；sources/source_type/date/created/updated、空时态字段、Content 标题与 Sources 脚注表由程序确定性编译
    - Agent/API 产出的 RAW#Lx 共享同一单遍精确编译器；共存 L13/L136 等前缀行号时必须分别生成 r13/r136，不得让短行号吞并长行号
    - API 长文档的 reduced context 必须在裁剪前绑定原始 doc.md 行号并在标题选择、头尾裁剪后保持这些 RAW handles；不得把裁剪结果重新从 L1 编号
    - Wiki 进入语义校验与 finalize 前必须拒绝残留 RAW handle、残缺 RAW 脚注片段和无法解析到 Raw 的已用脚注；Graph locator coverage 不得替代正文证据完整性校验
    - conference-summary 的短文合并 Worker 与长文 slots Worker 都必须用“本会议”作为页面主体代词，以匹配 knowledge-ir meeting profile；不得生成“本文档”伪节点
    - 图片为 ocr 且不自动 high；非图片会议为 speech-recognition/medium，PDF/DOC/DOCX 保留正式文档默认 official-doc/high，其余普通文本为 discussion/medium
    - department 仅在 Raw 逐字出现完整部门名称时保留；负责人关系仅在同一证据片段明确出现“负责人/负责”等职责措辞时保留，讲话/主讲不得推断为负责人
    - 所有通用文档 Wiki frontmatter 都由程序确定性写入 confidence，不依赖 Worker 自行提供
    - API 模式下不超过 30000 字符的通用文档由单次受限 Worker 同时产出 wiki 与候选语义槽；更长文档使用缩减上下文的 wiki→slots 两阶段路径
    - 合并 Worker 的 wiki 与语义槽仍分别经过 3.4/3.6 校验；语义槽硬错误最多基于已校验 wiki 定向重写 1 次
    - 'shared 来源日期解析消费原始 source 路径：依次采用文件名、正文明确标注的整理/编制/成文/签发/发布/更新日期、inbox 内由近到远的子文件夹名；支持点/横线/下划线分隔、紧凑数字和中文完整日期，并校验日历合法性。不读取 inbox 外祖先目录或文件时间戳；页面 ID 使用同一日期结果。嵌套 inbox 来源生成 <原文件名>.source.json 保存原始相对路径与文件夹名，随 manifest 受管落位 Raw，不能只依赖 temp 事务保存来源证据。conference-summary 的正文会议日期仅作事件事实；无来源日期写 date: null + date_status: unknown，created/updated 记录摄入日，ID 使用 undated 前缀'
    - 通用文档 Agent/API 语义协议只含 WIKI 与 SLOTS；来源日期和 ID 由程序裁决，不接受 LLM META 改写
    - shared 通用文档去重只接受重新核验 Raw 原件的 SHA-256 完全相同；标题或同名只作候选，指纹索引未命中时定向检查同名 Raw，包含独立子目录中的历史原件
    - 同名异文及原件/Markdown companion/来源 sidecar 任一目标冲突时，在原 Raw 类型目录下分配独立文档 ID 子目录，完整保留原文件名；分配结果存入事务供重试复用，Wiki sources 与受管 manifest 使用同一目录，finalizer 继续拒绝覆盖
    - 未知日期在模型草稿完全缺少 date 键时也须由程序补齐 null；正文完整日期的数字前后边界必须匹配，不得截断超长年月日作为合法日期
    writes:
    - temp/inbox-extract/<txn>/ doc.md/manifest.json/语义槽与 wiki 草稿
    - 最终 raw/wiki 经 inbox_finalize 原子落位
    - cross-domain/graph.db 经 graph_ingest
    - temp/inbox-extract/<txn>/graph-before.sqlite 作为落位后图失败的事务级精确回滚快照
    - <subproject>/wiki/log.md 与 index.md 与派生目录
    forbidden:
    - agent 全程监控正常摄入（默认 quiet，仅读最终 JSON）
    - 对学术论文 PDF 使用（走 ingest_paper.py）
    - 将 academic 通用文档静默映射到 admin，或把未知 academic 类型回退到 references
    - 绕过 3.4/3.6/3.8 校验闭环
    - 只因 graph_report/locator coverage 为绿色就把未通过最终 Wiki 脚注完整性校验的事务标记 completed
    - API 长文档先裁剪纯文本再调用 annotate_raw_lines，生成语法合法但指向错误原文行的伪 locator
    - 硬错误不回 3.3 而静默继续
    - 把 warning 当失败回 3.3 全量重写（应走 3.6b 局部修复）
    - 将摄入当天日期冒充文档来源日期或用于 undated 文档 ID
    - 从校长、讲话人、主讲人或文档主题自行推断 department/负责人，或允许无 Raw 逐字支持的字段与关系通过校验
    - wiki 结构校验失败后连续做超过 1 次全文 API 重写；超限必须保留当前草稿与精确错误转 agent_required
    - 语义槽硬错误连续做超过 1 次 API 定向重写；超限必须保留产物与精确错误转 agent_required
    - graph write/validate 失败时遗留 companion、新建图节点、related target 修改或 committed receipt；必须恢复 manifest 全文件与 graph snapshot
    verify:
    - python3 .scripts/test_ingest_document.py
    - python3 .scripts/test_ingest_admin.py
    - python3 .scripts/test_ingest_pipeline.py
    - python3 .scripts/test_ingest_check.py
    - python3 .scripts/test_wg.py
    - python3 .scripts/engineering_graph.py validate
  query_orchestrate:
    preconditions:
    - 本脚本只为 API backend 保存受预算约束的 query session 与运行模型循环；当前宿主 Agent 直接按 query task card 调用 query_actions/query_graph/source locator
    writes:
    - .scripts/query_sessions/<sid>.json（会话持久化,含 stage/mode/read_sources）
    forbidden:
    - 以 agent 模式名义启动内部模型循环、DSH 包装或 agent_required 交接
    verify:
    - python3 .scripts/test_query_orchestrate.py
    - python3 .scripts/test_query_api_loop.py
  answer_judge:
    preconditions:
    - 输入结果包含 retrieved 页面列表；优先消费结果随附的结构化 evidence_profile 与 required_disclosures
    - 旧实验结果缺少 Evidence Profile 时，只从其 retrieved 页面 frontmatter 机械重建 source_presence、source_types、version_status 与 conflict_markers
    writes:
    - --output 指定的实验评分 JSON
    forbidden:
    - 在生成或评分提示中维护脱离具体问题与 Evidence Profile 的全局来源权威排序
    - 把 status、source_type、type 或 related 单字段解释为事实正确性、权威充分性或冲突结论
    - 把 Evidence Profile 当作回答事实来源；事实内容仍来自 retrieved_text
    verify:
    - python3 .scripts/test_answer_judge.py
    - python3 .scripts/test_prompt_audit.py
    - python3 .scripts/engineering_graph.py validate
  frontier:
    preconditions:
    - 学术问题、论文明确开放问题、研究思路或验证记录已进入 Frontier 触发范围
    - 用户问题须先完成知识库召回、重复候选检查与 kb_state 评估；模型不可用时保留 captured/pending
    - Agent backend 生成 agent-task-v1，输入为有界 KB packet、输出为 temp JSON；API backend 才调用 llm_structured。二者的输出经过同一 assessment_schema/answer_schema 与 Raw locator 白名单校验

    - Raw Markdown locator 可使用行号、标题或紧随事实块后的 Kramdown 显式 ID 属性 `{: null
    - 显式事实锚点读取只返回其绑定的前一个 Markdown 块，不扩张到全文或相邻事实
    writes: []
    forbidden:
    - 把存在的 `{: null
    - 修改 Raw 内容来迁就 locator 解析
    verify:
    - python3 .scripts/test_wg.py
    - python3 .scripts/test_ingest_user_assertions.py
  ingest_user_assertions:
    preconditions:
    - 输入只能是 inbox/facts-pending.md，且每条待处理事实有稳定 fact ID、日期、陈述与可确定的目标 Wiki 页面
    - 事务先在同一文件系统暂存新的 Raw/Wiki/pending 内容和 graph plan；所有结构、locator 与图校验通过后才提交
    - Raw 追加、Wiki 更新、graph.db 写入、pending 清理和 receipt 作为一个受管事务；任一步失败必须恢复事务前字节与图快照

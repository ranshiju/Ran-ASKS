[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "ran-asks"
dynamic = ["version"]
description = "Agent-Driven Scientific Knowledge System workspace tooling"
requires-python = ">=3.12"
dependencies = [
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
release = [
  "numpy==2.5.1",
  "Pillow==12.3.0",
  "PyMuPDF==1.28.0",
  "python-pptx==1.0.2",
]
pdf = [
  "PyMuPDF>=1.28,<2",
  "requests>=2.32,<3",
]
office = [
  "Pillow>=12,<13",
  "openpyxl>=3.1,<4",
  "python-docx>=1.2,<2",
  "python-pptx>=1.0,<2",
  "xlrd>=2.0,<3",
]
analysis = [
  "numpy>=2.0,<3",
  "rank-bm25>=0.2,<0.3",
  "scipy>=1.16,<2",
  "tiktoken>=0.12,<1",
]
visual = [
  "matplotlib>=3.10,<4",
  "networkx>=3.5,<4",
  "numpy>=2.0,<3",
  "Pillow>=12,<13",
  "PyMuPDF>=1.28,<2",
  "python-pptx>=1.0,<2",
  "scipy>=1.16,<2",
]

[project.scripts]
ran-asks = "ran_asks.cli:main"

[tool.setuptools]
packages = ["ran_asks"]

[tool.setuptools.dynamic]
version = {file = ["VERSION"]}

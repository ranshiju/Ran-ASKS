# 论文→研究方向 hub 边的谓词 → tier 映射表
# tier 语义: 3=主方向级(主对象/建立在方向之上) | 2=中等相关(应用/贡献/延伸) | 1=边缘/兜底(触及/探索/无法归类)
# 用途: ingest 时 LLM 只选谓词(语义), 程序查表补 tier(派生, 不入 edges);
#       query hub top-k 按 tier 降序排序(紧密的优先返回)
# 维护: 谓词集动态扩充——LLM 新增谓词时此处登记 tier; 未登记谓词 ingest WARN + 默认 tier1
# 设计: 性质(谓词自由文本) + 紧密程度(tier序数) 正交, 类同 edge confidence 机制

predicates:
  主要研究: 3        # 论文以该方向为主要研究对象
  基于: 3            # 建立在方向的方法/理论之上
  紧密相关于: 3      # 强关联但非主/基
  应用于: 2          # 方向方法用于某问题
  贡献于: 2          # 向该方向贡献方法/结果
  延伸至: 2          # 从主方向延伸到该方向
  涉及: 1            # 触及该方向(非核心)
  探索: 1            # 早期/探索性接触
  属于: 1            # 兜底, 无法归入上述

default_tier: 1      # 未登记谓词的默认 tier

name: macOS compatibility
on:
  pull_request:
    paths: ['.scripts/**', 'ran_asks/**', 'pyproject.toml', '.github/workflows/platform-compat.yml']
  push:
    branches: [main, master]
    paths: ['.scripts/**', 'ran_asks/**', 'pyproject.toml', '.github/workflows/platform-compat.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portability:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8:strict
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[analysis,visual,office,pdf]"
      - name: Install LibreOffice on macOS
        run: brew install --cask libreoffice
      - name: macOS locks, paths, UTF-8 protocol, and actual PPTX rendering
        run: python .scripts/test_windows_compat.py --render
      - name: macOS workflow regressions
        shell: python
        run: |
          import subprocess, sys
          names = [
              'test_agent_task', 'test_visual_qa', 'test_slide_reuse',
              'test_pptx_document', 'test_pptx_academic', 'test_pptx_intake', 'test_source_ingest',
              'test_knowledge_units', 'test_citing_papers', 'test_paper_impact',
          ]
          failures = []
          for name in names:
              result = subprocess.run([sys.executable, f'.scripts/{name}.py'])
              if result.returncode:
                  failures.append(name)
          if failures:
              raise SystemExit('Failed: ' + ', '.join(failures))

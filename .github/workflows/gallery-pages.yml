name: Gallery Pages

# Manual publication and one daily refresh of public aggregate statistics.
on:
  workflow_dispatch:
  schedule:
    - cron: '23 20 * * *'

permissions:
  contents: read

concurrency:
  group: gallery-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'ranshiju/Ran-ASKS'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.11.28'
          enable-cache: true
      - name: Install locked environment
        run: uv sync --frozen
      - name: Validate Gallery boundaries
        run: |
          uv run python .scripts/test_gallery_site.py
          uv run python .scripts/test_gallery_metrics.py
      - name: Read aggregate Gallery statistics
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_SITE_TAG: ${{ vars.CLOUDFLARE_SITE_TAG }}
          CLOUDFLARE_ANALYTICS_API_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_API_TOKEN }}
        run: uv run python .scripts/gallery_metrics.py --reuse-published --output "$RUNNER_TEMP/gallery-metrics.json"
      - name: Build standalone Gallery
        env:
          GALLERY_CLOUDFLARE_TOKEN: ${{ vars.GALLERY_CLOUDFLARE_TOKEN }}
        run: uv run python .scripts/gallery_site.py --metrics "$RUNNER_TEMP/gallery-metrics.json" --output "$RUNNER_TEMP/gallery-site"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/gallery-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Gallery
        id: deployment
        uses: actions/deploy-pages@v4
